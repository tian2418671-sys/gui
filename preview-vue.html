<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>鬼 · 状态栏可视化编辑器（脱离酒馆）</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    background: #0d1117; color: #c9d1d9; font-size: 13px;
  }
  .topbar {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 14px; background: #161b22; border-bottom: 1px solid #30363d;
    position: sticky; top: 0; z-index: 10; flex-wrap: wrap;
  }
  .topbar h1 { font-size: 14px; margin: 0; color: #58a6ff; font-weight: 600; }
  .topbar .spacer { flex: 1; }
  .btn {
    background: #21262d; color: #c9d1d9; border: 1px solid #30363d;
    padding: 4px 10px; border-radius: 6px; cursor: pointer; font-size: 12px;
  }
  .btn:hover { background: #30363d; }
  .btn.primary { background: #1f6feb; border-color: #1f6feb; color: #fff; }
  .btn.primary:hover { background: #388bfd; }
  .btn.warn { background: #b62324; border-color: #b62324; color: #fff; }
  .layout { display: flex; height: calc(100vh - 45px); }
  .editor-pane {
    width: 400px; min-width: 340px; overflow-y: auto; padding: 10px 12px 40px;
    border-right: 1px solid #30363d; background: #0d1117;
  }
  .preview-pane { flex: 1; overflow: hidden; background: #0a0e10; }
  .preview-pane iframe { width: 100%; height: 100%; border: 0; background: #0a0e10; }
  .editor-pane::-webkit-scrollbar { width: 8px; }
  .editor-pane::-webkit-scrollbar-thumb { background: #30363d; border-radius: 4px; }

  /* 分组 */
  .group { margin-bottom: 10px; border: 1px solid #30363d; border-radius: 8px; overflow: hidden; }
  .group > .group-head {
    display: flex; align-items: center; gap: 8px; padding: 7px 10px;
    background: #161b22; cursor: pointer; user-select: none; font-weight: 600; color: #e6edf3;
  }
  .group > .group-head:hover { background: #1c2128; }
  .group > .group-head .chev { transition: transform .15s; color: #8b949e; }
  .group.closed > .group-head .chev { transform: rotate(-90deg); }
  .group > .group-body { padding: 8px 10px; display: grid; gap: 8px; }
  .group.closed > .group-body { display: none; }
  .group.nested > .group-head { background: #1c2128; font-size: 12px; padding: 5px 10px; }

  /* 字段行 */
  .field { display: flex; align-items: center; gap: 8px; min-height: 26px; }
  .field .f-label {
    width: 96px; flex-shrink: 0; color: #8b949e; font-size: 12px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .field .f-control { flex: 1; display: flex; align-items: center; gap: 6px; min-width: 0; }
  .field input[type="text"], .field textarea, .field select, .field input[type="number"] {
    width: 100%; background: #0d1117; border: 1px solid #30363d; color: #c9d1d9;
    padding: 4px 7px; border-radius: 6px; font-size: 12px; outline: none;
  }
  .field input[type="text"]:focus, .field textarea:focus, .field select:focus {
    border-color: #58a6ff;
  }
  .field textarea { resize: vertical; min-height: 42px; line-height: 1.5; }
  .field input[type="range"] { flex: 1; accent-color: #58a6ff; }
  .field .range-val { width: 42px; text-align: right; color: #58a6ff; font-size: 12px; font-variant-numeric: tabular-nums; }
  .field .bool { width: 18px; height: 18px; accent-color: #2ea043; }

  /* record / array */
  .rec { border: 1px dashed #30363d; border-radius: 6px; padding: 6px; display: grid; gap: 6px; background: #0a0d12; }
  .rec-item { border: 1px solid #21262d; border-radius: 6px; padding: 6px; display: grid; gap: 5px; background: #0d1117; }
  .rec-item .rec-head { display: flex; align-items: center; gap: 6px; }
  .rec-item .rec-head input[type="text"] { flex: 1; }
  .rec-item .del {
    background: none; border: none; color: #f85149; cursor: pointer; font-size: 14px; padding: 0 4px;
  }
  .rec-item .del:hover { background: #21262d; border-radius: 4px; }
  .rec-add {
    background: #21262d; border: 1px dashed #30363d; color: #8b949e;
    padding: 3px 8px; border-radius: 6px; cursor: pointer; font-size: 12px;
  }
  .rec-add:hover { color: #c9d1d9; border-color: #58a6ff; }
  .rec .field .f-label { width: 80px; }

  .empty-tip { color: #484f58; font-size: 12px; padding: 4px 0; }

  /* 数据统计条 */
  .stat-line { font-size: 11px; color: #484f58; }
  .stat-line b { color: #8b949e; font-weight: 600; }
</style>
</head>
<body>

<div class="topbar">
  <h1>◌ 鬼 · 状态栏可视化编辑器</h1>
  <span class="stat-line" id="statLine"></span>
  <span class="spacer"></span>
  <button class="btn" id="btnCollapseAll">全部折叠</button>
  <button class="btn" id="btnExpandAll">全部展开</button>
  <button class="btn" id="btnReset">重置为 initvar</button>
  <button class="btn" id="btnCopy">复制 JSON</button>
  <button class="btn" id="btnPaste">粘贴 JSON</button>
  <button class="btn primary" id="btnReload">刷新预览</button>
</div>

<div class="layout">
  <div class="editor-pane" id="editorPane"></div>
  <div class="preview-pane">
    <iframe id="previewFrame" src="preview-frame.html"></iframe>
  </div>
</div>

// 从 localStorage 恢复，否则用默认值
function loadStat() {
  try {
    const saved = localStorage.getItem('gui:editor:stat_data');
    if (saved) return JSON.parse(saved);
  } catch (e) {}
  return structuredClone(DEFAULT_STAT);
}
window.__STAT_DATA__ = loadStat();

function persistStat() {
  try { localStorage.setItem('gui:editor:stat_data', JSON.stringify(window.__STAT_DATA__)); } catch (e) {}
}
window.addEventListener('stat-data-changed', () => { persistStat(); updateStatLine(); });

// ════════════════════════════════════════════════════════════════
// 渲染器
// ════════════════════════════════════════════════════════════════
const editorPane = document.getElementById('editorPane');

function commit() {
  persistStat();
  updateStatLine();
}

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}

function renderField(container, key, def, obj) {
  const field = el('div', 'field');
  const label = el('span', 'f-label', key);
  field.appendChild(label);
  const ctrl = el('div', 'f-control');

  if (def.type === 'text') {
    const inp = document.createElement('input');
    inp.type = 'text'; inp.value = obj[key] ?? '';
    inp.addEventListener('input', () => { obj[key] = inp.value; commit(); });
    ctrl.appendChild(inp);
  } else if (def.type === 'textarea') {
    const ta = document.createElement('textarea');
    ta.value = obj[key] ?? '';
    ta.addEventListener('input', () => { obj[key] = ta.value; commit(); });
    ctrl.appendChild(ta);
  } else if (def.type === 'number') {
    const inp = document.createElement('input');
    inp.type = 'number'; inp.value = obj[key] ?? 0;
    inp.addEventListener('input', () => { obj[key] = Number(inp.value) || 0; commit(); });
    ctrl.appendChild(inp);
  } else if (def.type === 'range') {
    const r = document.createElement('input');
    r.type = 'range';
    r.min = def.min ?? 0; r.max = def.max ?? 100;
    r.step = def.step ?? 1;
    r.value = obj[key] ?? def.min;
    const val = el('span', 'range-val', String(r.value));
    const sync = () => { obj[key] = Number(r.value); val.textContent = r.value; commit(); };
    r.addEventListener('input', sync);
    ctrl.appendChild(r); ctrl.appendChild(val);
  } else if (def.type === 'bool') {
    const cb = document.createElement('input');
    cb.type = 'checkbox'; cb.className = 'bool';
    cb.checked = !!obj[key];
    cb.addEventListener('change', () => { obj[key] = cb.checked; commit(); });
    ctrl.appendChild(cb);
  } else if (def.type === 'select') {
    const sel = document.createElement('select');
    for (const opt of def.options) {
      const o = document.createElement('option');
      o.value = opt; o.textContent = opt;
      sel.appendChild(o);
    }
    sel.value = obj[key] ?? def.options[0];
    sel.addEventListener('change', () => { obj[key] = sel.value; commit(); });
    ctrl.appendChild(sel);
  } else if (def.type === 'stringarray') {
    const inp = document.createElement('input');
    inp.type = 'text';
    inp.value = (obj[key] || []).join('，');
    inp.placeholder = '用，分隔多个';
    inp.addEventListener('change', () => {
      obj[key] = inp.value.split(/[,，]/).map(s => s.trim()).filter(Boolean);
      commit();
    });
    ctrl.appendChild(inp);
  }
  field.appendChild(ctrl);
  container.appendChild(field);
}

// 在 record/array 的 item 内渲染单个字段：支持嵌套 group（如 穿着详情）
function renderItemField(container, key, def, obj) {
  if (def.type === 'group') {
    const sub = el('div', 'group nested');
    const subHead = el('div', 'group-head');
    subHead.appendChild(el('span', 'chev', '▾'));
    subHead.appendChild(el('span', '', key));
    const subBody = el('div', 'group-body');
    sub.appendChild(subHead); sub.appendChild(subBody);
    const child = obj[key] || (obj[key] = {});
    for (const fk of Object.keys(def.fields)) {
      renderField(subBody, fk, def.fields[fk], child);
    }
    subHead.addEventListener('click', () => sub.classList.toggle('closed'));
    container.appendChild(sub);
    return;
  }
  renderField(container, key, def, obj);
}

function renderRecord(container, key, def, obj, direct) {
  const rec = el('div', 'rec');
  // direct=true 时直接编辑 obj（顶层 record 组如 能力），否则编辑 obj[key]
  const data = direct ? (obj || {}) : (obj[key] || (obj[key] = {}));
  const rebuild = () => { rec.innerHTML = ''; renderItems(); };
  const renderItems = () => {
    for (const k of Object.keys(data)) {
      const item = el('div', 'rec-item');
      const head = el('div', 'rec-head');
      const nameInp = document.createElement('input');
      nameInp.type = 'text'; nameInp.value = k;
      nameInp.addEventListener('change', () => {
        if (nameInp.value && nameInp.value !== k) {
          const v = data[k]; delete data[k]; data[nameInp.value] = v; rebuild();
        }
      });
      const del = el('button', 'del', '✕');
      del.title = '删除 ' + k;
      del.addEventListener('click', () => { delete data[k]; rebuild(); commit(); });
      head.appendChild(nameInp); head.appendChild(del);
      item.appendChild(head);
      for (const fk of Object.keys(def.itemFields)) {
        renderItemField(item, fk, def.itemFields[fk], data[k] || (data[k] = {}));
      }
      rec.appendChild(item);
    }
    const add = el('button', 'rec-add', '+ 添加 ' + key);
    add.addEventListener('click', () => {
      let name = prompt('新' + key + '名称：');
      if (!name) return;
      if (data[name]) { alert('已存在同名条目'); return; }
      data[name] = structuredClone(def.defaultItem || {});
      rebuild(); commit();
    });
    rec.appendChild(add);
  };
  renderItems();
  container.appendChild(rec);
}

function renderArray(container, key, def, obj, direct) {
  const rec = el('div', 'rec');
  // direct=true 时直接编辑 obj（顶层 array 组如 在场角色），否则编辑 obj[key]
  const data = direct ? (obj || []) : (obj[key] || (obj[key] = []));
  const rebuild = () => { rec.innerHTML = ''; renderItems(); };
  const renderItems = () => {
    data.forEach((item, idx) => {
      const it = el('div', 'rec-item');
      const head = el('div', 'rec-head');
      head.appendChild(el('span', 'f-label', '#' + (idx + 1)));
      const del = el('button', 'del', '✕');
      del.title = '删除该项';
      del.addEventListener('click', () => { data.splice(idx, 1); rebuild(); commit(); });
      head.appendChild(del);
      it.appendChild(head);
      for (const fk of Object.keys(def.itemFields)) {
        renderItemField(it, fk, def.itemFields[fk], item);
      }
      rec.appendChild(it);
    });
    if (!data.length) rec.appendChild(el('div', 'empty-tip', '（空）点击下方添加'));
    const add = el('button', 'rec-add', '+ 添加角色');
    add.addEventListener('click', () => {
      data.push(structuredClone(def.defaultItem));
      rebuild(); commit();
    });
    rec.appendChild(add);
  };
  renderItems();
  container.appendChild(rec);
}

function renderGroup(container, def, data) {
  const g = el('div', 'group');
  const head = el('div', 'group-head');
  head.appendChild(el('span', 'chev', '▾'));
  head.appendChild(el('span', '', def.title));
  const body = el('div', 'group-body');
  g.appendChild(head); g.appendChild(body);
  for (const key of Object.keys(def.fields)) {
    const fdef = def.fields[key];
    if (fdef.type === 'group') {
      const sub = el('div', 'group nested');
      const subHead = el('div', 'group-head');
      subHead.appendChild(el('span', 'chev', '▾'));
      subHead.appendChild(el('span', '', key));
      const subBody = el('div', 'group-body');
      sub.appendChild(subHead); sub.appendChild(subBody);
      const child = data[key] || (data[key] = {});
      for (const fk of Object.keys(fdef.fields)) {
        renderField(subBody, fk, fdef.fields[fk], child);
      }
      body.appendChild(sub);
    } else if (fdef.type === 'record') {
      // 顶层 record 组（能力）直接编辑 data 本身；嵌套 record 编辑 data[key]
      const direct = (key === '__record');
      const wrap = el('div', '');
      if (!direct) wrap.appendChild(el('div', 'f-label', key));
      renderRecord(wrap, key, fdef, data, direct);
      body.appendChild(wrap);
    } else if (fdef.type === 'array') {
      // 顶层 array 组（在场角色）直接编辑 data 本身；嵌套 array 编辑 data[key]
      const direct = (key === '__array');
      const wrap = el('div', '');
      if (!direct) wrap.appendChild(el('div', 'f-label', key));
      renderArray(wrap, key, fdef, data, direct);
      body.appendChild(wrap);
    } else {
      renderField(body, key, fdef, data);
    }
  }
  head.addEventListener('click', () => g.classList.toggle('closed'));
  container.appendChild(g);
}

function buildEditor() {
  editorPane.innerHTML = '';
  for (const gk of Object.keys(SCHEMA_DEF)) {
    // 顶层 group 绑定到 __STAT_DATA__[gk]，而非整个 __STAT_DATA__
    const groupData = window.__STAT_DATA__[gk] || (window.__STAT_DATA__[gk] = {});
    renderGroup(editorPane, { title: gk, fields: SCHEMA_DEF[gk].fields }, groupData);
  }
  updateStatLine();
}

function updateStatLine() {
  const d = window.__STAT_DATA__;
  const roles = (d.在场角色 || []).length;
  // 能力已拆为 能力.先天 / 能力.后天 / 能力.被动 三个 record
  const countUnlocked = (rec) => {
    const r = d.能力?.[rec] || {};
    return Object.keys(r).filter(k => r[k]?.是否解锁).length;
  };
  const countPassive = () => {
    const r = d.能力?.['被动'] || {};
    return Object.keys(r).filter(k => r[k]?.是否获得).length;
  };
  const innate = countUnlocked('先天');
  const learned = countUnlocked('后天');
  const passive = countPassive();
  const known = (d.隐藏 && d.隐藏.已知 ? Object.keys(d.隐藏.已知.家族成员 || []).length : 0);
  const items = (d.物品 || []).length;
  const quests = (d.任务 || []).length;
  document.getElementById('statLine').innerHTML =
    `怨气 <b>${d.鬼魂?.怨气 ?? 0}</b> · 记忆 <b>${d.鬼魂?.记忆 ?? 0}</b> · 已掌握 <b>${innate}先天/${learned}后天</b> · 被动 <b>${passive}</b> · 在场 <b>${roles}</b> · 物品 <b>${items}</b> · 任务 <b>${quests}</b> · 已知家族 <b>${known}</b>`;
}

// ════════════════════════════════════════════════════════════════
// 工具栏
// ════════════════════════════════════════════════════════════════
document.getElementById('btnReload').addEventListener('click', () => {
  const f = document.getElementById('previewFrame');
  f.src = 'preview-frame.html?t=' + Date.now();
});
document.getElementById('btnReset').addEventListener('click', () => {
  if (!confirm('重置为 initvar 默认值？当前编辑内容将丢失。')) return;
  window.__STAT_DATA__ = structuredClone(DEFAULT_STAT);
  persistStat(); buildEditor();
  document.getElementById('previewFrame').src = 'preview-frame.html?t=' + Date.now();
});
document.getElementById('btnCopy').addEventListener('click', () => {
  navigator.clipboard.writeText(JSON.stringify(window.__STAT_DATA__, null, 2)).then(() => {
    alert('已复制 stat_data JSON');
  });
});
document.getElementById('btnPaste').addEventListener('click', () => {
  const txt = prompt('粘贴 stat_data JSON：');
  if (!txt) return;
  try {
    const parsed = JSON.parse(txt);
    window.__STAT_DATA__ = parsed;
    persistStat(); buildEditor();
    document.getElementById('previewFrame').src = 'preview-frame.html?t=' + Date.now();
    alert('已应用粘贴的 JSON');
  } catch (e) {
    alert('JSON 解析失败：' + e.message);
  }
});
document.getElementById('btnCollapseAll').addEventListener('click', () => {
  document.querySelectorAll('#editorPane .group').forEach(g => g.classList.add('closed'));
});
document.getElementById('btnExpandAll').addEventListener('click', () => {
  document.querySelectorAll('#editorPane .group').forEach(g => g.classList.remove('closed'));
});

buildEditor();
</script>
