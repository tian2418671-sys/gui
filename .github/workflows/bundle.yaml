name: bundle

on:
  push:
    branches:
      - master
      - main
    paths-ignore:
      - dist/**
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: ${{ github.workflow }}

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: JesseTG/rm@v1.0.3
        with:
          path: dist

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - run: pnpm install && pnpm build

      # 本仓库 dist/Gui 产物必须带 __webpack_require__ 补丁：
      # webpack outputModule 产物缺该声明, iframe 里会 ReferenceError → CDN 状态栏空白
      # （酒馆角色卡脚本经 jsdelivr 引用 dist/鬼/..., 状态栏界面引用 dist/Gui/...）
      - name: Patch dist/Gui with __webpack_require__ stub
        if: github.repository != 'StageDog/tavern_helper_template'
        run: |
          F="dist/Gui/界面/状态栏/index.html"
          if [ -f "$F" ] && ! grep -q 'var __webpack_require__={}' "$F"; then
            sed -i 's|<script type="module">|<script type="module">\\nvar __webpack_require__={};|' "$F"
          fi

      - name: Only keep 角色卡示例 in dist for template upstream
        if: github.repository == 'StageDog/tavern_helper_template'
        run: |
          mv dist/角色卡示例 角色卡示例
          rm -rf dist
          mkdir dist
          mv 角色卡示例 dist/
      - name: Remove 示例 in dist for templated repository
        if: github.repository != 'StageDog/tavern_helper_template'
        run: |
          rm -rf dist/角色卡示例 dist/脚本示例 dist/流式楼层界面示例 dist/前端界面示例
      - name: Commit changes
        uses: EndBug/add-and-commit@v9.1.3
        with:
          default_author: github_actions
          message: '[bot] bundle'

      # 自动打 tag 已禁用: v0.0.x tag 会与卡版本号混淆且造成垃圾 tag 堆积
      # 卡的 CDN 引用一律走 @main, 不依赖 tag
