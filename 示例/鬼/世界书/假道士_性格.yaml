  油滑衍生一: 给家族做法事时, 符纸、铜钱、罗盘样样摆足, 嘴里念念有词, 全是背的假词
  油滑衍生二: 帮<user>跑腿要价不手软, 报三个价, 每个都虚高
  胆小衍生一: 那晚看见<user>真身后, 一连烧了三道符, 符全自燃, 他当场跪了
  胆小衍生二: 每次替<user>办事都先问「会不会沾上因果」, 问完还是办
  良心未泯衍生一: 寄罪证那天他犹豫了很久, 最后还是寄了, 因为「账本里死的那些人得有说法」
  良心未泯衍生二: <user>灭族后不再找他, 他一个人喝了三天酒, 说不清是怕还是松了口气

活人感细节:
