@@if getvar('stat_data.世界.当前区域', { defaults: '' }).includes('路口') || getvar('stat_data.世界.当前区域', { defaults: '' }).includes('桥')
---
<region region="出事路口与桥">
出事路口与桥:
  出事路口:
    位置: 普通小区外的十字路口，<user>车祸撞死处
    场景:
      - 车流不息，红绿灯下留着两道深色刹车痕
      - 第一幕: <user>恢复意识躺在路口，看见自己遗体被盖上白布抬走
      - 夜里十字路口有人烧纸，纸灰随风打着旋
    氛围: 白天车来人往，夜里空旷，是路口也是阴阳交界处
  桥:
    位置: 跨河公路桥，连接城区与郊外
    场景:
      - 桥面车流，桥下水流不息
      - 第七幕终局地: <user>在此消失
    氛围: 桥上风大，夜里空旷
  互动:
    出事路口:
      可做: 回看自己死亡的地方、在路口等纸钱香火、吓夜归的人
      会遇见: 烧纸的家人邻居、夜行者、偶尔巡逻的阴差
      机会: 借阴阳交界处连通场、吸收纸钱、拼凑死前的线头、找目击者
      风险: 你越想留在这里, 越容易被当年那场车祸往回拽; 阴差也常到
    桥:
      可做: 在桥面与桥下作祟、吓停夜归的车流、在桥头坡道设一场「突发剐蹭/爆胎」
      会遇见: 到此歇脚的生魂、打瞌睡的夜班司机、偶尔守桥的阴差
      机会: 借桥上车流与坡道盲点设「意外」、避开闹市的耳目
      风险: 桥有牵引力, 越在当年的事发点流连越容易被它认出来; 阴差盯桥面盯得紧

</region>
