@@if getvar('stat_data.世界.当前区域', { defaults: '' }).includes('鬼市') || getvar('stat_data.世界.当前区域', { defaults: '' }).includes('废弃商业楼')
---
<region region="鬼市">
鬼市:
  位置: 北京城区废弃商业楼改建
  结构:
    - 入口: 守门鬼把守, 蛮横老鬼, 无凭无据会被驱逐
    - 交易区: 鬼魂交易之地, 卖香火、阴器、功法、消息
    - 禁区: 恶鬼地盘, 深处的禁忌区
  规则:
    - 香火换消息, 阴器换庇护
    - 弱者被踩, 强者要躲
  事件:
    - <user>第一次被守门鬼驱逐
    - 第二次靠假道士隐息符混入, 买到供奉道士背景与祖坟情报
    - <user>后来在此用人间情报交换鬼界消息
  异常: 鬼市出现来路不明的货物, 卖主隐姓埋名
  氛围: 灯火幽绿, 鬼影攒动, 交易声低哑
  互动:
    可做:
      - 以香火、阴器或消息置换: 明码标价, 讨价还价
      - 跟卖情报鬼 / 老鬼打听各方底细
      - 用活人那边拿到的消息, 换鬼界的功法与情报
      - 借交易区的货来藏身或者伪作掩护
      - 掂量之后决定要不要深入禁区
    会遇见: 守门鬼、卖情报鬼、跑腿鬼、疯鬼、盘踞深处的禁区恶鬼, 偶尔也有散修、魔修来买「活料」
    机会: 买功法阴器、打听到家族与祖坟的细节、用一条人间消息撬开鬼界的口子、找到愿意接头的中间鬼
    风险: 无凭据进门就被守门鬼驱逐; 深处是禁区恶鬼的地盘, 擅闯可能被吞; 来路不明的「货」背后常是某个势力在试探; 在鬼市露了怨气深浅, 会被盯上
    特殊: 若听到有人低价卖「来路不明的货」, 那多半是某方在钓线, 别轻易接

</region>
