最高管理层:
  - 酆都大帝: 地府最高行政长官, 主宰冥界阴司及天下所有鬼魂
  - 东岳大帝: 由天庭敕封, 主掌世间万物生死, 地府只是其管辖范围之一
  - 地藏王菩萨: 西方佛国派驻地府, 发愿地狱不空誓不成佛, 主度化鬼魂
  - 五方鬼帝: 管辖五方鬼蜮, 与十殿阎罗平级; 东方鬼帝（神荼、郁垒）治桃止山和鬼门关

十殿阎罗:
  第一殿: 秦广王, 初步审判, 善者超升, 恶者押往孽镜台照见本心
  第二殿: 楚江王, 审判伤人肢体、奸盗杀生等罪, 管活大地狱
  第三殿: 宋帝王, 审判忤逆尊长、教唆兴讼等罪, 管黑绳大地狱
  第四殿: 五官王, 审判抗粮赖租、交易欺诈等罪, 管合大地狱
  第五殿: 阎罗王, 总领十殿, 专审谋反、弑亲等十恶不赦重罪, 管叫唤大地狱
  第六殿: 卞城王, 惩罚怨天尤人、亵渎神明等, 管大叫唤大地狱及枉死城
  第七殿: 泰山王, 惩治取骸合药、离人至戚等, 管热恼地狱
  第八殿: 都市王, 审判不敬师长、诽谤圣贤等, 管大热大恼大地狱
  第九殿: 平等王, 关押罪大恶极的鬼魂, 管阿鼻大地狱
  第十殿: 转轮王, 最终裁决, 核定六道轮回投胎去向

地府官僚体系:
  首席判官: 崔珏（崔府君）, 手持生死簿和判官笔, 记录阳间善恶, 决定寿命长短
  四大判官:
    - 赏善司: 魏征
    - 罚恶司: 钟馗
    - 察查司: 陆之道
    - 阴律司: 掌刑狱
  六案功曹: 辅助阎王办公的文书人员
  阴差缉捕司: 负责拘魂与押解
  黑白无常: 白无常（谢必安）接引善魂, 黑无常（范无救）缉拿恶鬼
  牛头马面: 负责押解亡魂
  十大阴帅: 鬼王、日游神、夜游神、无常、牛头、马面等

基层网络:
  - 城隍: 阴间地方官, 分管各地, 下设十二分司
  - 土地: 最基层的阴间神祇

亡魂旅程:
  - 鬼门关 → 黄泉路 → 彼岸花 → 望乡台 → 恶狗岭/金鸡山/野鬼村 → 迷魂殿 → 酆都城 → 十八层地狱 → 供养阁 → 忘川河 → 奈何桥 → 孟婆亭 → 三生石 → 轮回
