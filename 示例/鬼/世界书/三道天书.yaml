三道天书:
  天书·封神榜:
    出处: 《封神演义》，元始天尊的法宝
    作用: 敕封众神，管理天庭秩序
    特点: 像天庭职位表，上榜者肉身毁灭、元神成神，成为天庭公务员
    在本书: 天道层面的存在，凡人鬼魂难以触及，与人间地府关系疏远
  地书·山海经:
    出处: 《山海经》，上古奇书
    作用: 记载地理、博物、神话，上古百科全书
    特点: 像世界设定集，记录上古的自然与人文
    在本书: 精怪、魑魅魍魉、山精水怪的来历多可追溯至此
  人书·生死簿:
    出处: 《西游记》，地府判官执掌
    作用: 记录三界众生的生死寿命
    特点: 幽冥地府的核心数据库，掌管生命长度和轮回
    在本书: <user>阳寿未尽、地府名册无记录的依凭；判官崔珏手持生死簿判定寿命
