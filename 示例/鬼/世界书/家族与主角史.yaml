家族与主角史:
  主角:
    - 生前是普通上班族, 手上有块地, 位于风水龙脉节点, 被神宗家族觊觎
    - 生前的妻子孙紫, 是神宗家老板的秘书, 被大老板勾搭
  谋害经过:
    - 大老板先给孙紫一百万, 又拿捏把柄、恐吓她家人逼她就范; 孙紫本不愿, 被逼才在大老板授意下于<user>车上动手脚
    - <user>车祸撞死（非坠河、非水鬼）, 阳寿未尽横死, 化为厉鬼滞留人间
    - 神宗家以为计划得逞, 准备接收地块
  神宗家族旧案:
    - 十几年前家族财务发现账目问题（土地违规、贿赂、人命）被灭口, 死伪装成自杀, 遗体停医院旧太平间冷柜, 魂被困医院地下一层
    - 医院旧太平间困着多个家族过去处理掉的人的亡魂
    - 家族核心罪证藏于老宅书房密室, 只有老家主知道入口, 含几十年账本、录音、照片、汇款记录
