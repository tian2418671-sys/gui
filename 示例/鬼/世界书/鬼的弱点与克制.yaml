先天弱点:
  阳气与正气:
    - 人属阳鬼属阴, 人怕鬼三分鬼怕人七分
    - 身体健康阳气旺者鬼不敢近
    - 心地光明一身正气者（军人、大善人）鬼敬而远之
  阳光: 对鬼魂有灼伤效果, 白天必须躲藏
  鸡鸣: 天鸡一叫, 在册鬼魂必须返回阴间; 阳寿未尽的横死鬼不受此限, 但会浑身发紧
  大风: 天上罡气压得鬼魂动弹不得、浑身剧痛
  寒冷: 部分鬼（如水鬼）常受寒冷之苦, 需靠在活人周围吸收生气取暖

辟邪物品:
  植物与木材: 桃木（最著名辟邪木）、豆类、芦索（芦苇）、艾草、无患子（鬼见愁）
  动物与相关物品: 黑狗血、鸡鸣、老虎、狗牙
  人造器物: 红色、铜镜或八卦镜、墨斗（木匠工具）、屠刀、玉器
  符咒与经书: 符咒、经书（道家或儒家）、八卦图

特殊弱点:
  - 水鬼怕独眼龙: 遇到水鬼时闭上一只眼它会暂时消失
  - 山魈怕桑刀: 山魈怕老桑木削成的刀

对道门的畏惧:
  身份压制: 道士职责即降妖捉鬼维持阴阳秩序, 执法者身份使鬼魂天然畏惧, 尤其受过戒有道行的道士
  技术压制: 符咒法术可召神遣将束缚鬼魂; 考召之术通过审讯鬼魂解决问题; 呼名术（《女青鬼律》记载, 知道恶鬼名字就能克制它）等于掌握鬼的命门
  装备压制: 桃木剑、法印、葫芦等法器皆为鬼魂克星
  背景压制: 道士可召请天兵神将（雷部元帅、王灵官等）助阵
