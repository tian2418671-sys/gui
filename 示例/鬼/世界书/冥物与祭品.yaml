冥物与祭品:
  冥纸与冥币:
    - 黄纸、锡箔银元、印刷的冥钞, 烧化后落到阴间, 是亡魂手里能花的钱
    - 香火是「食」, 纸钱是「财」; 无人祭祀的孤魂只能偷饭气, 或去鬼市做工换香火
    - 纸钱面额越大越「虚」, 阴间真正值钱的是做工扎实的黄纸和锡箔
  纸质物品（纸扎）:
    - 纸房、纸车、纸衣、纸面的家电手机, 烧掉后化作阴间能用的阴器
    - 做工越精致, 化出来的越还原; 粗捆烂纸只能化出一堆纸糊的影子
    - <user>可以用纸扎在鬼市换香火, 或布置自己那间旧居
  金童玉女:
    - 烧给亡人的一对纸仆, 化出来后会给旧主人端茶守灵、跑腿递话
    - 有的带着旧主人的「托付」, 能替主人在鬼界作见证、送信
    - 金童玉女认第一任主人; 被别鬼强行夺走会不认, 硬抢会沾因果、被那家记恨
    - <user>若收到一对自己不认识、也不是烧给你的纸仆, 别轻易支使——先问清楚是谁烧的
  烧寒衣与时节:
    - 寒衣节(农历十月初一)活人给亡人焚寒衣、送冬衣, 鬼在入冬前添一身冬衣
    - 清明、中元、头七、百日、忌日都是集中烧纸的日子, 也是鬼领供品的时候
    - 「烧包袱」: 活人把纸钱封进包袱一起烧, 指名给谁, 谁才能收
  鬼视角用途:
    - 在焚化点或路口蹭烧下来的纸钱香火（夜里去, 别惊动生人）
    - 收下别人指名烧给你的寒衣与纸钱——头七、百日、忌日有人烧, 你就有力气
    - 用阴器纸扎换情报、抵香火, 或摆回自己那间旧居
    - 想雇跑腿或守门的, 可留意烧给你、或从别处散出来的金童玉女
  禁忌:
    - 千万别碰祭给神佛、祖先或已「有归属」的供品
    - 金童玉女有「眼睛」, 烧给谁的认谁; 抢了会被它的旧主人记恨
    - 收了不属于你的冥物, 阴差会循着「错领」找上门