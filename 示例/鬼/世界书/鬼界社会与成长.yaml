鬼界社会:
  底层:
    - 孤魂野鬼: 鬼口的大多数, 无人祭祀, 无依无靠, 饥寒交迫
  中层:
    - 地府公务员: 鬼差、鬼卒、判官
    - 鬼将: 地府军队将领, 生前多为大将军
  上层:
    - 鬼王: 众小鬼头目, 拥有地府名号, 享受香火, 能号令一方群鬼
    - 多财鬼: 饿鬼中的贵族, 有福报, 有宫殿仆从
  鬼市:
    - 鬼魂聚集交易之地, 卖香火、阴器、功法、消息
    - 有人间废地改建的, 也有地府外围开设的
  规则:
    - 弱者被踩, 强者要躲, 谁都不帮你
    - 鬼王鬼将能号令一方群鬼, 形成鬼界势力
    - 任何事物、任何死法、任何执念都能衍生出对应的鬼

成长路径:
  吸收能量: 不断吸食香火、供品或活人阳气来维持并增强自身
  吞噬同类: 强大的恶鬼通过吞噬其他鬼魂或活人魂魄来壮大自己, 如恶修罗
  修炼成鬼仙: 道教理论中最下乘的修炼法门, 闭目冥坐、炼成阴神, 能脱离轮回成为清灵之鬼; 八仙之一的铁拐李是鬼仙的典型代表
