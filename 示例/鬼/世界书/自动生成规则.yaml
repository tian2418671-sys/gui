自动生成规则:
  使用场景:
    - 游历其他城市时
    - 剧情需要新人物、新势力、新地点、新敌人时
  自动创建NPC:
    - 命名具体真实（中文名，符合身份与地域）
    - 每个NPC有明确身份、目标、与<user>的关系（可交流/敌对/中立）
    - 行为符合鬼界或人间的规则，有自己的生活痕迹
  自动创建势力:
    - 势力有名称、地盘、目的、与现有势力的关系
    - 类型符合世界观：家族、道门、出马仙、鬼王、魔修、精怪族群等
  自动创建地点与环境:
    - 地点具体（街道名、建筑、标志物），能融入当前城市
    - 环境体现阴阳两界特征（阳气旺/阴气重/有灵异传闻）
  自动创建敌人:
    - 敌人强度与<user>当前怨气能力平衡，不突然无敌也不白给
    - 敌人类型符合世界观：鬼、精怪、道士、魔修、僵尸等
  记录:
    - 生成的重要NPC、势力、地点记录到变量，避免重复
    - 已生成的实体持续存在，之后会被再次遇见
  原则:
    - 严禁全知视角：新内容只在<user>接近时呈现
    - 生成的内容要推动故事或提供选择，不空转
    - 每次游历一座城市，生成 2~4 个可交互的实体或事件
