按习性职能分类:
  拘魂鬼:
    职能: 专职勾魂
    特征: 身穿紫衣, 手持名册
    习性: 按时勾取将死者的魂魄
  墓鬼:
    职能: 墓地守护
    特征: 身形模糊
    习性: 爱好安静, 会鬼打墙等恶作剧警告打扰者
  蓬头鬼:
    职能: 动物保护神
    特征: 头发如针
    习性: 白天出没于森林, 遇到他只需答应掩埋动物尸体
  小儿鬼:
    职能: 夭折儿童之鬼
    特征: 孩童模样
    习性: 夜晚出现, 逗弄惊吓小孩, 寻找玩伴
  宅鬼:
    职能: 住宅作怪
    特征: 无固定形态
    习性: 喜欢在住宅中制造异常动静, 捉弄住户
  雷鬼:
    职能: 自然之鬼
    特征: 形似猿猴或熊, 背生双翼
    习性: 能引导雷电
  大头鬼:
    职能: 外形特征类
    特征: 头大如斗
    习性: 因负担过重而行动缓慢
  狐鬼:
    职能: 妖鬼
    特征: 狐狸修炼成精
    习性: 常化作美女魅惑人
  黄父鬼:
    职能: 恶鬼
    特征: 自称山灵, 能变化形态
    习性: 出没山林, 变化戏人
  五奇鬼:
    职能: 特殊组合
    特征: 五只鬼共同行动
    习性: 分工协作, 一鬼在前, 其余在后
  科场鬼:
    职能: 失意文人
    特征: 书生打扮
    习性: 因科考失意徘徊不去, 常在考场附近出没
  痴鬼:
    职能: 因情而死
    特征: 神情恍惚
    习性: 因情所困, 死后执念不散, 徘徊于故地
  魍魉鬼:
    职能: 山精水怪
    特征: 形影不定
    习性: 古籍记载, 模仿人声迷惑人
  俎鬼:
    职能: 古籍记载
    特征: 形态不详
    习性: 见于志怪古籍
  讨债鬼:
    职能: 讨债
    特征: 眉眼刻薄
    习性: 前世有债未清, 投胎或显形讨债, 债清方去
  魇鬼:
    职能: 梦中压人
    特征: 无形, 压覆在睡者胸口
    习性: 让人动弹不得、呼吸困难, 阳气弱者易被缠
  伥鬼:
    职能: 虎之帮凶
    特征: 被虎所吃之人所化
    习性: 为虎作伥, 引诱活人入虎口
  穷鬼:
    职能: 败财
    特征: 衣衫褴褛
    习性: 缠人败财, 被缠之家日渐贫穷
  虚耗:
    职能: 偷窃
    特征: 小人形, 穿红衣
    习性: 偷窃财物、食物, 使人家中莫名失物
  哭丧鬼:
    职能: 报凶
    特征: 夜半哭声, 不见其形
    习性: 哭声传出之地多生凶事
  影鬼:
    职能: 影中作祟
    特征: 只有影子没有实体
    习性: 附在活人影子上, 让影子做出异动
  望乡鬼:
    职能: 思乡
    特征: 面向家乡方向
    习性: 死后回望家乡, 徘徊在返乡路上
  路倒鬼:
    职能: 拦路
    特征: 形似乞丐
    习性: 死在路边, 拦活人讨钱讨饭, 讨不到则纠缠
  迷路鬼:
    职能: 迷魂
    特征: 无形
    习性: 施展鬼打墙, 让活人在原地兜圈
  长舌鬼:
    职能: 吓人
    特征: 长舌拖地
    习性: 夜间伸舌吓人, 不作实质加害
  半身鬼:
    职能: 残躯游荡
    特征: 只有上半身, 以手代足
    习性: 贴地爬行, 惊吓活人
