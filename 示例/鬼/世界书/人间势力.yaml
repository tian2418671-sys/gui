正统道门:
  正一道（龙虎山天师道）: 符箓派核心
  茅山上清派: 三山符箓之一
  阁皂山灵宝派: 三山符箓之一
  神霄派: 擅长雷法
  清微派: 擅长雷法与符箓
  净明道: 强调忠孝
  全真道: 注重内丹修炼, 不尚符箓

民间法教:
  茅山法教: 民间体系, 与正统茅山不同, 指庞大法术体系, 因影视作品被神化
  梅山教: 源自湖南, 祖师张五郎（形象常为倒立巫师）, 当今最昌盛的民间法教之一
  排教: 另一著名民间法教
  阴山派: 隶属道教但偏向巫术, 以捉生替死术等秘法闻名

出马仙（北马）:
  起源: 源于萨满教万物有灵信仰, 北方主流
  核心: 修炼有成的动物仙家选择人间弟子（弟马）济世度人
  传统五大仙族: 胡（狐狸）、黄（黄鼠狼）、白（刺猬）、柳（蛇）、灰（老鼠）, 胡仙为领袖
  新五大仙族: 胡、黄、常（蛇）、清（鬼仙）、花（其它生灵）
  堂口体系: 仙家组建堂口, 内部有四梁八柱（清风、碑王等）和扫堂、监堂等职能部门

巫傩杂家:
  - 端公: 西南地区男性巫师, 神鬼媒介, 主司捉鬼驱邪
  - 神汉/巫婆: 各地对巫师的称呼
  - 鬼师: 广西等地称呼, 有连通阴阳的能力
  - 师婆: 女性巫师, 从事祈福、驱鬼、占卜
  - 阴阳先生: 从事殡葬风水, 也处理灵异事件
  - 走阴差/走无常: 声称能活人入阴间传递消息
  - 问米婆/灵媒: 通过问米等方式请死者灵魂上来对话
  - 少数民族巫师: 壮族魔公、瑶族赶鬼公等

各派关系:
  - 正统道门视民间法教为旁门左道
  - 民间法教互相之间有传承竞争
  - 出马仙自成一系, 与道门若即若离
  - 巫傩杂家各自为政, 地域性强
  - 各方理念之争由来已久, 互不相让

魔修:
  - 猎鬼炼器, 吸魂养功, 各方皆敌
