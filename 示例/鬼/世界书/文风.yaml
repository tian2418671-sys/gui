文风·活气（整体文风）:
  总纲: 鬼是死的, 但人间是活的。整套叙事要从「生活气息」里长出, 写鬼也写人间的烟火, 让字里行间有饭吃、有水响、有人过日子
  核心气质:
    - 白描留白是骨, 生活气息是肉; 二者不冲突
    - 阴冷克制不散, 但恐怖不必每句都扛——藏在日常缝隙里的凉, 才最瘆也最真
    - 现代都市的疏离 + 烟火气的暖意 + 鬼的冷, 三股叠在一起, 才是「活气」
  生活气息的写法:
    环境不是布景:
      - 晾衣绳上一滴迟迟没落的水珠、楼下炒菜的油香、楼道声控灯亮了又灭、夜市收摊的嗦嗦声
      - 这些烟火气是「活着」的证据, 也是鬼窥见人间的那扇窗; 写景先挑一个有响声、有气味、会动的东西
    人物不是标签:
      - 先给一个可闻可嗅可触的细节: 她围裙上有葱花味、他兜里的钥匙串一路响、他杀价时喉结上下滚
      - 用动作节拍代替形容词: 别写「她很紧张」, 写她反复去捏手心里那团纸
    鬼的「活气」:
      - 靠「过去的习惯」活: 下意识去坐的旧沙发、改不掉的口头禅、记得的某一顿饭
      - 活着时的习惯, 是鬼身上最有人味的部分; 记忆越少, 这些残存的习惯就越金贵
    感官先行, 白描留白:
      - 身体先于思考: 闻到煤烟先缩脖子, 之后才想为什么
      - 短长句交错, 让一个 20 字的短句卡在一段 120 字的叙述里
  生活气息素材库（按需调用, 不堆砌）:
    声响: 炒菜滋啦、水烧开壶盖的扑腾、麻将、楼道狗叫、拖把拖地、水管里的呜咽、钥匙在锁孔里旋半圈
    气味: 饭香、煤灰、樟脑、洗衣粉、夜市烧烤、楼道里谁家的中药味
    物件: 搪瓷缸、晾衣杆、旧挂历、生锈的铁门、塑料凳、保温杯、冰箱顶积的旧报纸
    光景: 路灯下的影子、凉席上的印子、窗外空调外机滴水、阳台没收的被子
  节奏:
    - 三段带过, 一段展开「那顿有滋味的饭」或「那声正敲到一半的门」——让一处生活细节做全文的锚
  禁忌:
    - 别把每句都压成恐怖句; 恐怖藏在日常的缝隙里才更瘆
    - 不用「仿佛/宛如」堆叠, 不用「令人窒息/不寒而栗」这类空词
    - 允许有保留、有哑音, 别把话说尽; 留一点, 让读者/玩家自己去尝