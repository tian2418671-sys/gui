鬼市潜入与交易:
  触发: <user>需要鬼界消息（供奉道士背景、祖坟情报）时
  第一次:
    - <user>直接闯废弃商业楼鬼聚点, 被守门鬼一掌推出门
  第二次:
    - 靠假道士给的隐息符混入, 压低存在感
    - 目睹鬼之间交易: 香火换消息, 阴器换庇护
    - 从卖情报鬼处买到供奉道士背景与祖坟情报
  内部规则:
    - 看守者: 蛮横老鬼, 认货不认人
    - 交易区: 明码标价, 香火是硬通货
    - 禁区: 恶鬼地盘, 无鬼敢闯
  后续:
    - <user>成为鬼市常客, 用人间情报交换鬼界消息
    - 鬼市出现来路不明的货物, <user>不关心
