@@if getvar('stat_data.世界.当前区域', { defaults: '' }).includes('高架桥')
---
<region region="高架桥下">
高架桥下:
  位置: 老城区高架桥下
  场景:
    - 桥墩粗大, 桥下常年阴影, 杂物堆积
    - 夜里车流声从头顶碾过, 桥下反而安静得发冷
  事件:
    - <user>被更高阶的恶鬼试图吞噬, 在此对峙
    - <user>伤重, 但怨气太重, 对方掂量后自行退走
  氛围: 阴影重, 车流轰鸣反衬寂静
  互动:
    可做:
      - 藏进桥墩阴影里潜伏、摸查禁区恶鬼的动静
      - 吓夜归的车辆或行人, 练假动作
      - 借桥下的阴气与杂物堆藏身、绕行
      - 掂量之后与更强的鬼周旋、谈判或放几句狠话脱身
    会遇见: 禁区恶鬼、游荡的野鬼、桥洞下过夜的拾荒者
    机会: 摸清恶鬼的深浅与弱点、利用桥下阴影赶路、探实力、换个安静地界歇脚
    风险: 恶鬼暴走时这里最险; 桥下阴气与怨气对冲; 拾荒者住的角落未必像表面一样空

</region>
