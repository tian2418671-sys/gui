美色惑人之鬼:
  风流鬼:
    来历: 生前好色纵欲, 死于花柳病/奸情被杀/死在女人身上
    形态: 生前样貌, 多为风流公子相, 衣着华丽或半透明纱衣, 面带轻浮笑意
    习性: 入梦交合吸阳气但不杀生, 纠缠美女, 被呵斥即退
    出没: 花街柳巷、废弃妓院、旅馆
    危害: 最低, 以色取乐为主
  艳鬼:
    来历: 多为美女横死, 因情或冤屈而死, 怨念极重
    形态: 极美, 衣着讲究, 面容苍白, 无脚后跟, 走路无声
    习性: 魅惑男子与之交合, 吸大量阳气, 轻则大病, 重则精尽人亡
    出没: 深夜街头、桥下、旧宅、老井旁, 身上有脂粉味或腐烂花香
    识别: 用自己的脸, 非剥皮
    危害: 中等, 以美色杀生
  画皮鬼:
    来历: 面目被毁, 剥活人皮披在自己身上
    形态: 披皮时为绝色美女或美男子, 脱皮时为血肉模糊无五官的怪物
    习性: 专剥活人皮、食人心, 不怕阳光但喜夜间活动
    出没: 荒郊、驿站、偏僻客栈
    识别: 后颈或后背有缝合线痕, 照镜子会短暂现原形
    危害: 最高, 披别人的皮吃人心
  迷魂女鬼:
    来历: 横死怨女所化
    形态: 身段曼妙, 面容半隐
    习性: 以幻象迷人心智, 让人主动跟她走
    出没: 夜间小路、水边
    危害: 迷魂后溺毙或坠亡

区别:
  - 风流鬼: 色鬼, 取乐为主, 危害最小
  - 艳鬼: 用自己的脸魅惑杀人, 危害中等
  - 画皮鬼: 披别人的皮吃人心, 危害最大
