---
<region region="第四幕·削弱家族屏障·多步小场景">
第四幕·削弱家族屏障·多步小场景:
  总目标: 拆开三重防护（供奉道士 / 祖坟阵法 / 血脉气运），打开对神宗家下手的口子
  前置: 确认了拍板杀<user>的三人之后，才进入本幕
  节奏: 每一步都给足铺垫，不一步到位；家族的猜忌与争权用对话和场景细节表现
  步骤流程:
    第一步·摸底:
      地点: 家族老宅外 / 家族私立医院 / 鬼市情报摊
      做法: 摸供奉道士的作息与软肋，查家族成员里谁最容易被离间、谁最怕死
      人物: 供奉道士、老家主、堂兄、卖情报鬼
      转折: 财务女鬼在太平间给了一句提醒「那道士信命，不信人」
      风险: 白天有阳气；阵法在时硬闯会被反制
      通过标志: 拿到离间下手的「钥匙」（道士的旧证件、老家的把柄、家族防他的迹象）
    第二步·离间:
      地点: 家族议事 / 供奉道士落脚处 / 假道士的香堂
      做法: 借假道士或中间人的口，让供奉道士觉得自己正被神宗家当消耗品；制造「家族也防着他」的迹象
      人物: 供奉道士、假道士、中间人、老板
      成功标志: 供奉道士留下一句「有些账，你们自己还」而离开，风水大阵出现缺口
      失败: 离间不成则硬来代价大，会被阵法反制、惊动阴差
      风险: 离间的证据要留三分真，撕破脸前别让老板起疑心
    第三步·凿阵:
      地点: 后山小路 / 祖坟风水大阵
      做法: 沿无阵眼的小路进祖坟，找出三处阵眼，逐个动手脚或灌入怨气
      后果: 祖坟植物枯黄、墓碑裂纹；老家主脑溢血瘫痪，血脉气运出现裂痕
      风险: 动祖坟会惊动供奉道士（若还没走）与阴差；灌怨气时<user>自己的记忆也会被拖进更深处
      关键: 先凿哪一处、灌多少怨气，由<user>决定，但越重压越消耗记忆
    第四步·收线:
      地点: 家族私立医院 / 堂兄病房 / 老板办公室 / 老宅正堂
      做法: 借医院制造「意外」收割家族成员；趁家族猜忌互咬时把账往彼此身上引
      人物: 堂兄、老板、妻子、家族成员
      结果: 家族内部崩裂、互相怀疑，为第六幕灭族铺路
      注意: 每桩死因要「看似意外」，死者却面带恐惧——这就是<user>留下的记号
  沙盒提示: 若<user>中途改主意、或某一步提前达成，可按玩家意愿自由推进本幕进程
  一幕界限: 供奉道士未离开前，硬闯祖坟阵法会被反制；未凿开阵眼前，不进入大面积收割
  反扑变奏·猎人变猎物（第四幕腰）:
    触发: 凿阵或收割触及家族痛处后，家族开始反扑，天平第一次颠倒
    戏剧冲突:
      - 家族察觉「这不是寻常仇杀」后请外援、加派驻守、排查鬼的行动路线
      - 供奉道士若已被离间，家族偏不认输，改请更硬的外道或镇物替代
      - 阴差因阳间非正常死亡增多而上门查案，把<user>夹进两方之间
    压力构造:
      - <user>头一回被「猎物」反咬：追查时有反查、落脚点被端、藏的东西被人动过
      - 某次行动要搭进一段记忆、或丢一个可信之人/庇佑，作为代价
    转折: <user>须先抽身自保（换线、弃子、故布疑阵）再回头，节奏由「猎」转「藏」再转「猎」
    留钩子: 反扑里让某位成员悄然「知情而不说」或露出倒戈迹象，给后续留线
    台阶: 反扑不是无脑加难，而是「回应 + 预判」的拉锯；<user>赢在耐心，也赢在记忆之外那点还没忘完的聪明
</region>