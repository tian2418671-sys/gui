@@if getvar('stat_data.世界.当前区域', { defaults: '' }).includes('医院')
---
<region region="家族私立医院">
家族私立医院:
  位置: 北京城区, 神宗家族名下私立医院
  地上部分: 普通私立医院, 病房、门诊、急诊, 家族核心成员住院避难处
  地下一层:
    - 旧太平间: 停着多个家族过去处理掉的人的遗体
    - 冷柜: 财务女鬼的遗体困在冷柜, 魂被困医院无法离开
    - 困魂: 旧太平间的亡魂都是家族灭口的死者
  事件:
    - 第五幕: 家族成员在病房、走廊、电梯陆续死亡, 各有不同死法
  氛围: 消毒水味混着阴冷, 地下一层常年不见光, 太平间冷柜偶尔发出细微响声
  互动:
    可做:
      - 地下一层旧太平间找财务女鬼打听、请她带路
      - 在病房、走廊、电梯里吓人 / 动手脚制造「意外」
      - 混进档案室翻病历、查家族成员的身体与看护规律
      - 借太平间与困魂的遮掩躲藏、避一避天上的事
    会遇见: 财务女鬼、旧太平间的医院亡魂、上夜班的护士与护工、来探病/陪护的家族成员、个别能看见的濒死之人
    机会: 从病历档案里挖罪证、借困魂打听被灭口者的旧账、用太平间当安全屋、掌握家族成员的作息好下手
    风险: 急诊与门诊阳气最重难久留; 监视探头多; 出了人命会惊动阴差; 第五幕乱象时医院会被盯上
    触发: 家族成员住院时适合在此布局, 各楼层不同之死多在此地

</region>
