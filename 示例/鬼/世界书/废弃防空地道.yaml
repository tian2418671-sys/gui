@@if getvar('stat_data.世界.当前区域', { defaults: '' }).includes('防空洞') || getvar('stat_data.世界.当前区域', { defaults: '' }).includes('地道')
---
<region region="废弃防空地道">
废弃防空地道:
  位置: 老城区地下, 废弃防空工事
  场景:
    - 入口隐蔽, 铁门锈蚀, 需用力推开
    - 地道狭窄潮湿, 墙皮剥落, 地面有积水
    - 深处黑暗无光, 回声重
  用途:
    - <user>躲避恶鬼追杀时钻入, 在地道学会收敛怨气、藏自己
    - 曾作为<user>的住处之一
  氛围: 潮湿发霉, 滴水声, 阴冷
  互动:
    可做:
      - 借地道藏身歇养、睡上一觉
      - 关起门来收敛怨气、压低存在感, 躲追杀与躲阴差
      - 把账本、信物、偷来的东西藏进深处的铁柜里
      - 顺着地道网络在城区夹缝里穿行, 避开阳气足的大路
    会遇见: 同样躲藏的野鬼、误闯的流浪者、偶尔循着滴水声而来的鼠类
    机会: 一处少人打扰的安全屋、练收敛、藏匿证据、绕开白天的太阳
    风险: 深处无光易迷路; 空气潮重会拖累魂体; 藏身点若被更强的鬼发现, 就成了猎物
    提示: 地道交叉口记得记路; 别人留下的油污和烟头, 说明这里不止你一个在避世

</region>
