@@if getvar('stat_data.世界.当前区域', { defaults: '' }).includes('老宅') || getvar('stat_data.世界.当前区域', { defaults: '' }).includes('祖坟')
---
<region region="家族老宅">
家族老宅:
  位置: 北京城郊, 神宗家族祖宅
  布局:
    - 前院: 石狮子, 院墙高深, 门房常年有人
    - 正堂: 家族议事与祭祖处, 挂神宗氏祖谱
    - 书房: 老宅书房, 密室入口在此, 只有老家主知道
    - 密室: 藏着几十年账本、录音、照片、汇款记录, 是家族核心罪证
    - 后院: 通往后山祖坟
  祖坟:
    - 风水大阵: 神宗家族三重防护之一, 布有符文法器, 护血脉气运
    - 后山小路: 无阵眼的小路, 可绕进祖坟
    - 七月半: <user>将怨气灌入风水脉, 祖坟植物枯黄、墓碑裂纹
  氛围: 老宅阴冷, 院墙高, 夜里门窗响动, 供奉道士撤走后阵法出现空缺
  互动:
    可做:
      - 后山小路绕进祖坟, 摸清风水阵法的阵眼
      - 潜入书房找密室, 翻账本、录音、照片、汇款记录来攒罪证
      - 在正堂、前院盯梢, 听家族议事里漏出来的话
      - 趁夜对祖坟阵眼动手脚, 或往风水脉里灌怨气
    会遇见: 老家主、堂兄、门房、来议事的家族成员; 撤走前还有供奉道士在正堂坐镇
    机会: 收集罪证进度、拿捏家族决策、找到家族某个人的破绽、在祖坟给自己留后手
    风险: 院墙外有护院与阳气; 阵法在时硬闯会被反噬; 书房密室可能有人在守; 祖坟风水脉动会惊动供奉道士与阴差
    提示: 供奉道士在时最好绕开正堂; 撤走后阵法出现缺口, 才是动手的时机

</region>
