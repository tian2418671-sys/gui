鬼的规则:
  死后流程:
    - 人死后灵魂脱离肉体变为鬼魂
    - 正常流程: 鬼差将亡魂带入地府, 走审判流程, 排队投胎
    - 横死之鬼怨气更重, 更难勾走, 容易滞留人间
  鬼魂状态:
    - 滞留时间过长会魂体消散
    - 怨气积累会堕为厉鬼
    - 鬼魂之间能互相看见、听见、触碰、交流
    - 低阶鬼灵智低, 高阶鬼保留完整灵智
  阶级:
    - 幽魂野鬼是最底层, 无依靠无势力, 只能躲藏求生

鬼的生存:
  饮食:
    - 香火与纸钱: 焚烧香和纸钱产生的能量是鬼魂最喜欢的食物
    - 供品精华: 吸食祭品（饭菜、水果）的馨香; 被鬼吃过的供品索然无味且容易腐败
    - 窃取饭气: 无人祭祀的孤魂野鬼去饭馆或民居周围偷吸饭菜的热气和香气
    - 特殊饮食: 食气鬼吸食活人气息; 食血鬼出没于屠宰场; 希祠鬼以人类祭祀物为食
  祭祀与纸钱:
    - 烧纸、焚香、祭拜是活人给亡魂送能量与财物的方式
    - 烧化的纸钱在阴间是流通的财物, 香火是食物
    - 十字路口、坟前、小区楼下是常见烧纸处, 清明、中元、头七是集中祭祀日
    - 无人祭祀的鬼魂只能偷饭气, 或去鬼市做工换香火
    - 有人给<user>烧纸, 是少有的稳定能量来源; 头七、百日、忌日有人烧纸, 他会有力气
  住房:
    - 冥界: 大部分鬼魂的居所
    - 野外与坟墓: 散落人间的鬼魂多居住阴冷的森林、坟冢之间, 可形成「鬼村」聚落
    - 破庙与废弃房屋: 无家可归的鬼魂寄居其中
    - 城市夹缝: 游荡城市的饿鬼常受当地守护神驱逐, 无处安身, 只能辗转流浪
