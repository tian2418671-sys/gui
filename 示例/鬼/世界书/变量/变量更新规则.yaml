---
变量更新规则:
  世界:
    当前时间:
      format: YYYY年M月·时辰
      check:
        - 每次事件推进、休息或移动后更新，保持时间流逝合理
        - 夜晚是鬼魂活动时间，白天必须躲藏
    当前区域:
      check:
        - <user>移动后更新为当前所在地（河边/家族老宅/家族私立医院/鬼市/废弃防空地道/高架桥下/城中别墅等）
    时辰:
      type: '白天'|'黄昏'|'夜晚'|'凌晨'
      check:
        - 与当前时间一致
        - 白天<user>必须躲藏，不得在阳光下行动
    当前幕:
      type: '第一幕·觉醒'|'第二幕·初次尝试'|'第三幕·人间的另一个窗口'|'第四幕·削弱家族屏障'|'第五幕·医院中的其他鬼'|'第六幕·灭族'|'第七幕·之后'
      check:
        - 主线推进到对应幕时更新，一次只在一个幕
        - 按幕顺序推进，不跳幕
    当前剧情阶段:
      check:
        - 用一句话描述当前剧情进展
  鬼魂:
    姓名:
      value: 生前的名字；记忆归零后变？？？
    是否记得自己:
      type: boolean
      check:
        - 记忆大量流失或归零后变为 false
    怨气:
      type: number
      range: 0~100
      check:
        - 复仇行动、仇恨加深、吸食怨气时增长
        - 怨气增长时，记忆约按 0.6 倍流失，人性残余同步降低
        - 阈值解锁能力：40入梦、60科技骚扰、80区域作祟
    记忆:
      type: number
      range: 0~100
      check:
        - 随怨气增长按约 0.6 倍流失
        - 归零后忘记自己是谁，姓名变？？？
    隐匿度:
      type: number
      range: 0~100
      check:
        - 收敛怨气、压低存在感时提升
        - 怨气爆发时下降
    香火:
      type: number
      range: 0~9999
      check:
        - 鬼市交换、吸食香火供品时增减
  能力.${灯灭镜裂|温度骤降|入梦|感官篡改|科技骚扰|区域作祟}:
    是否解锁:
      type: boolean
      check:
        - 灯灭镜裂、温度骤降初始可用
        - 怨气达 40 解锁入梦，达 60 解锁科技骚扰，达 80 解锁区域作祟
    等级:
      type: number
      range: 1~5
      check:
        - 能力使用增多、怨气增长时提升
    描述:
      value: 能力的具体效果
  复仇:
    当前目标:
      value: 当前复仇目标
    家族成员.${老家主|老板|堂兄|旁系|姻亲}:
      状态:
        type: '活着'|'重伤'|'疯狂'|'死亡'
        check:
          - 家族成员状态变化时更新
          - 死亡顺序先旁系再嫡系最后老板
          - 死因看似自然或意外（心脏病/中风/自杀/车祸），但死者面带恐惧
      死因:
        value: 表面死因
    妻子:
      状态:
        type: '活着'|'恐惧'|'疯狂'|'死亡'
        check:
          - 妻子不死亡（结局活着见证全族覆灭），状态随恐惧加深变化
      位置:
        value: 妻子的位置
    防护屏障:
      供奉道士:
        type: '在场'|'被离间'|'已离开'|'无'
        check:
          - 第四幕离间供奉道士后离开
      祖坟阵法:
        type: '完好'|'出现缺口'|'已污染'|'崩毁'
        check:
          - 供奉道士撤走后出现缺口，灌怨气后污染，灭族时崩毁
      血脉气运:
        type: '完好'|'受损'|'断裂'
        check:
          - 祖坟阵法崩毁后血脉链条断裂
    罪证:
      进度:
        type: number
        range: 0~100
        check:
          - 密室罪证收集进度，逐步提升
      见证者:
        value: 女鬼要求留的活见证人
  鬼界:
    地盘:
      value: 当前所在鬼的地盘
    鬼市关系:
      type: '未知'|'被驱逐'|'可进入'|'常客'
      check:
        - 首次被驱逐，隐息符混入后可进入，多次交易后为常客
    庇护:
      value: 愿意帮<user>的鬼或人
    敌人:
      value: 鬼界敌人
  威胁:
    阳光暴露:
      type: number
      range: 0~100
      check:
        - 白天暴露在阳光下时升高，躲入阴影或夜晚时归零
    阴差注意:
      type: number
      range: 0~100
      check:
        - 家族非正常死亡增多、地府查访时提升
    被捉鬼人盯上:
      type: boolean
      check:
        - 被散修或魔修盯上时变为 true
  隐藏:
    人性残余:
      type: number
      range: 0~100
      check:
        - 随怨气增长而降低，残余越低越接近恶鬼
    记忆碎片:
      value: 还记得的生前碎片
      check:
        - 记忆流失时移除对应碎片
