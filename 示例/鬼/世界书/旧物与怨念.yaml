旧物与怨念(物件上的执念):
  说明: 流散在人间的旧物自带「气」——墓里的、贴身的、凶器与替身, 越老越邪; <user>是鬼, 反过来最会「读」这些物件, 也能借它们藏、借它们查、借它们害人
  第一类·墓葬出土品(冥器):
    - 古玉(血沁玉): 葬玉封魂, 血沁玉被认为寄宿墓主执念, 「玉养人」的极端反面; 玉里那口气深, 鬼可以贴着它躲人、借它听一段陪葬前的旧事
    - 青铜器/陶俑: 人形陶俑被相信「替代真人之灵」, 埋久易附墓主之气; 兵马俑类小件夜里会有「醒」的错觉, 是鬼可借的「壳」, 也是墓主怨气扎堆的地方
    - 压口钱/口含(玉蝉): 沾了死者最后一口气, 阴气极重; 是鬼天然的「身份证明」, 也可用来跟懂行的人讨价还价
  第二类·古旧家具与建筑构件:
    - 老屋房梁/门板: 「梁不沾地」, 经历了凶杀的旧梁承载家运也承载不安; 拆下的旧梁是「带故事的木料」, 鬼附进去能顺着认识那一家的底细
    - 老梳妆台/铜镜: 古铜镜像通灵之物; 若曾属女子含恨而终, 镜面封存其影, 深夜对镜照出不该看的东西; <user>可借镜「再演」那晚的事, 也能拿镜反照来「斥退」别的胆小鬼
    - 旧太师椅/床榻: 逝者临终长卧之处留病气与执念; 鬼借旧床能「接」到故人的最后一幕, 却也可能被那股病气拖住
  第三类·亡者贴身遗物:
    - 寿衣/老式绣花鞋: 寿衣极阴, 三寸金莲绣花鞋午夜相传会自行走动; 鬼穿旧鞋能「走回」亡者的旧路
    - 带血迹/划痕的首饰: 银镯、发簪带暗红沁色或深磨痕, 多来自陪葬或戴在尸身上; 这类东西认主, 鬼戴上能撑起一段「死者身份」骗过同类与人间
    - 雨伞/旧纸扇: 「伞」谐「散」且遮阳, 易招孤魂藏匿; 也是鬼随身躲日头、藏身段的好物件
  第四类·特殊凶器与刑具:
    - 锈蚀刀剑(战场兵器): 刀身黑红铁锈带煞气与亡魂怨念; 鬼可借之「提气」, 被打散时有一口兵器的凶气撑着, 但用多了会被它的杀念反咬
    - 刑具/枷锁/脚镣: 衙门死牢积攒囚犯绝望; 一套旧枷锁锁得住人也锁得住鬼, 鬼拿它当「控场」: 套谁谁动不得, 自己却要防着也被锁住
  第五类·替代性与替身物品:
    - 古旧人偶/布娃娃: 民间忌讳给玩偶画眼——画了眼就「开光引灵」; 呆滞的陶瓷娃娃夜里最邪; 鬼能借娃娃当「身体」混进活人场合, 也可当诱饵引别人上钩
    - 打不开的梳妆盒/首饰盒: 内壁若有咒文或封条痕, 里面可能锁着不干净的东西; 对鬼是「匣子」也是「牢」, 找到一把对得上锁的东西, 就等于握着一件能谈条件的筹码
  民俗处理办法与原理(对鬼的实际意义):
    - 民俗相信旧物邪门 · 原理三说: 一曰「万物有灵」, 贴身老物件记录主人的气; 二曰「磁场残响」, 人把情绪留在旧物里; 三曰「尸毒秽气」, 出土物带古代微生物, 误触致病便归之于鬼上身
    - 传统化解: 新得古物用朱砂点红/红布裹隔绝阴气; 阳光下暴晒七日消散阴气; 入庙请高功洒净、烧「退煞符」
    - 对<user>的威胁: 活人拿这些东西「净物」「晒七」, 等于在扫地, <user>若借宿在里头会被一并清掉; 遇到懂行的用朱砂红布一裹, 想钻进去的东西就出不来
  关键提示:
    - 旧物越老越好用, 但每件都「带主」: 借它一时可以, 想霸着不放, 会被原来那股执念反吸
    - 想查冤案、认门路、藏身段, 墓里出的、贴身的、凶器、替身, 各有各的路数; 别错拿「镇宅件」(如新抹了朱砂、被供奉过的)当普通物, 那东西专克鬼
</region>