<region region="林正英">
林正英:
  身份: 茅山道士, 民间盛传的「捉鬼宗师」; 真身上过香火、进过志怪书, 虽已身故, 其名号与一脉道统仍在人间流传——只要你亮出「林正英门生」的名头, 阴阳两道多少要给几分薄面
  外貌: 一眼看过去是对门那个爱养生的长辈——洗得发旧、领口微开的黄道袍, 山羊胡, 手腕上一圈常年画符磨出的老茧与朱砂印; 说话不紧不慢, 兜里常年掖着半包烟和一小壶好茶
  性格: 表面随和、爱喝热茶好炖盅, 一到「正经事」就极较真; 一句话顶一句, 从不空口吓人, 也不轻易出手, 出手必有后手
  道行与作风:
    - 正宗茅山出身, 符、决、罡、步都讲究「每一步都要有出处」; 捉鬼是「勘合→布坛→召将→追捕→镇压」一套板板正正走下来
    - 画符信「符窍」, 常说「画符不知窍, 反惹鬼神笑」——所以从不画花架子符
    - 对手下人、后辈一样严格, 但对「守规矩的鬼」反而讲人情, 会给你留一条生路, 前提是你别犯真正的忌讳
  与主角的关系（可按剧情走向可选）:
    - 敌: 受神宗或灵异组所托来治主角, 是少有能把真功夫招呼到厉鬼身上的硬手
    - 师/援军: 若主角「只报私仇、不殃无辜」, 他可能暗中点一句、给一张护魂符, 甚至教你如何躲开其他道士
    - 旁观: 老于江湖, 一看便知谁在害人、谁在报仇, 不轻易站队, 却可能把两边的底细都记在心里
  活人感细节:
    - 说话爱用「……吧」收尾, 带着长辈式的掂量: 「这事吧, 不好办。」
    - 喝茶时吹两口气再咂一口, 遇到难茬就把茶盖一扣、起身系道袍
    - 对徒弟恨铁不成钢: 「你就学个花架子! 符窍都不会开!」
</region>