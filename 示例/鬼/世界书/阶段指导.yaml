@@private
<%_ const act = getvar('stat_data.世界.当前幕', { defaults: '第一幕·觉醒' }); _%>
<%_ if (act === '第一幕·觉醒') { _%>
阶段指导:
  当前幕: 第一幕·觉醒
  goal: 让<user>接受死亡现实，拼凑被杀真相，初次品尝怨气化能力
  narration_focus:
    - 以车祸现场感官（刹车痕、路灯光、柏油路、半透明视野）营造死后的陌生感
    - 葬礼、旧居、妻子与老板的片段式画面推动真相浮现
    - 阳光灼伤与鸡鸣体现鬼魂的生存约束
  interaction:
    - 允许<user>选择先去哪、看什么、跟不跟
    - 妻子与老板的对话只给片段，不一次说全
  progression_boundary:
    - 未拼凑出「刹车被动、谁拍板」前，不进入正面骚扰活人
<%_ } else if (act === '第二幕·初次尝试') { _%>
阶段指导:
  当前幕: 第二幕·初次尝试
  goal: 让<user>学会用能力骚扰活人，并建立与假道士的合作
  narration_focus:
    - 骚扰手段按能力从弱到强展开（噩梦、幻听、低温）
    - 假道士的符纸自燃与吓跑是转折点，让<user>意识到人间有人能看见自己
  interaction:
    - 骚扰的具体对象与手段由<user>决定
    - 假道士的恐惧与讨价还价要具体，不一次服软
  progression_boundary:
    - 未与假道士建立信息渠道前，不进入家族情报线
<%_ } else if (act === '第三幕·人间的另一个窗口') { _%>
阶段指导:
  当前幕: 第三幕·人间的另一个窗口
  goal: 让<user>看清家族全貌，目标从杀老板升级为灭全族
  narration_focus:
    - 通过假道士的情报逐块拼出家族构成与祖坟位置
    - 老鬼的地盘警告穿插鬼界规则
  interaction:
    - 情报获取的方式（买、逼、换）由<user>选择
    - 假道士从被迫到半自愿的转变要自然
  progression_boundary:
    - 未确认拍板杀<user>的三个人前，不进入对家族防护动手
<%_ } else if (act === '第四幕·削弱家族屏障') { _%>
阶段指导:
  当前幕: 第四幕·削弱家族屏障
  goal: 拆掉家族三重防护，打开复仇缺口
  narration_focus:
    - 离间供奉道士要给出可信的铺垫，不能一步到位
    - 七月半灌怨气入风水脉的后果（枯黄、裂纹、瘫痪、车祸）分幕呈现
  interaction:
    - 离间与潜入的具体操作由<user>决定
    - 家族的猜忌与争权通过对话和场景细节表现
  progression_boundary:
    - 供奉道士未离开前，<user>硬闯祖坟阵法会被反制
<%_ } else if (act === '第五幕·医院中的其他鬼') { _%>
阶段指导:
  当前幕: 第五幕·医院中的其他鬼
  goal: 在医院建立鬼界同盟，拿到密室罪证线索，同时继续收割
  narration_focus:
    - 旧太平间的亡魂群像与财务女鬼的引导是核心
    - 家族成员在病房、走廊、电梯的死亡要有不同的死法
  interaction:
    - 是否答应女鬼「留见证者」的条件由<user>决定
    - 家族成员的互相出卖要通过对话表现
  progression_boundary:
    - 未拿到密室罪证线索前，不进入大规模灭族
<%_ } else if (act === '第六幕·灭族') { _%>
阶段指导:
  当前幕: 第六幕·灭族
  goal: 按先旁系再嫡系最后老板的顺序完成灭族
  narration_focus:
    - 每个死者的死因看似意外但面带恐惧，营造集体恐慌
    - 老板的最后死法（困在报废旧车里尾气而死）要留足仪式感
  interaction:
    - 杀人顺序与方式由<user>决定，但死因要「像意外」
    - 家族成员的挣扎与求饶要具体
  progression_boundary:
    - 老板未死前，不进入收尾
<%_ } else if (act === '第七幕·之后') { _%>
阶段指导:
  当前幕: 第七幕·之后
  goal: 收尾罪证公之于众，呈现记忆流失与孤魂的结局
  narration_focus:
    - 罪证寄出、案件重查的过程给足细节
    - <user>的记忆流失通过日常细节体现（想不起妻子脸、住址、名字）
    - 财务女鬼的消散与桥上终局要有余韵
  interaction:
    - 玩家可自行决定最后的行动（寄证据、看女鬼消散、走向桥边）
    - 结局不强行救赎，保持黑暗基调
  progression_boundary:
    - 故事走向终局后不再展开新的复仇线
<%_ } else { _%>
沙盒模式·游历:
  goal: 自由游历其他城市，遇见更多人和事，<user>以厉鬼身份在人间继续存在
  narration_focus:
    - 自动生成新NPC、势力、地点、环境、敌人
    - 每座城市有自己的灵异生态：本地鬼王、道士、出马仙、精怪
    - <user>的记忆流失持续，但在新城市可慢慢拼回零星记忆碎片
  interaction:
    - 玩家自由决定去哪个城市、接触谁、帮谁或害谁
    - 不站人类一方也不站鬼一方，谁有用就用谁，谁挡路就除掉谁
  progression_boundary:
    - 沙盒模式无固定结局，以玩家意愿推进或结束
<%_ } _%>
