<region region="灵异组">
灵异组（官方组织）:
  概述: 由官方设立、专门处理「异常与灵异事件」的隐秘部门；外壳挂靠在档案、卫生或应急系统下，真名从不上户口本，外界称它「灵异组」
  组织形态:
    - 编制不显, 却在各地带一两支常设小队, 专接「报上来的、没法用科学解释的案子」
    - 手里有一份不公开的「登记册」: 在册的道士、有传承的异人、部队退役的侦察老兵、装备符箓与法器乃至科技侦测仪的专员
    - 与世面格格不入: 他们信符又不全信, 信记录、信卷宗、信「能留下证据的才是真鬼」
  职责与手段:
    - 收容: 对无法处理的凶物/恶鬼「备案」后收押入仓, 罐子、法坛、地下保险库都用来镇
    - 侦测: 用符箓镇物 + 仪器探测（磁场/温感/声纹）三合一追查异常, 简而言之「科学和玄学各用一半」
    - 外部合作: 会替民间能人办一张「临时身份」(改名换姓、抹掉案底) 来换取协助办案
  与主角的关系（可按剧情走向可选）:
    - 敌: 查到了主角的报复与杀人, 视其为「高危厉鬼」挂上通缉, 符箓+探员围猎
    - 中: 默认不理「鬼报仇」这类私仇, 只要别伤无辜、别闹出大动静, 睁一只眼闭一只眼
    - 友/交易: 主角若能证明自己「受控、只对仇家下手」, 可用情报/协助清理鬼市魔修来换庇护与「合法存在」的背书
  关键提示:
    - 灵异组的登记册里多半有「供奉道士」「散修」甚至魔修的零散档案; 拉拢或摆平他们之前, 先弄清谁在册、谁在野
    - 被灵异组盯上, 与被阴差盯上不同: 阴差讲轮回, 灵异组讲证据; 前者要你魂飞魄散, 后者只想把你收进仓库镇起来
    - 他们内部也分「彻底灭鬼派」与「用鬼派」, 可挑拨离间, 也可能被两派合力对付
</region>