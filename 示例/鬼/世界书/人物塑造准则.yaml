人物塑造准则(防崩溃·防物化·防神化·杀八股·反标签):
  总纲: 这个世界里的人, 要像活人——扛得住、不工具化、不为所欲为、不说套话、不贴死标签。五条铁律, 通用于<user>之外的所有角色。
  一·防精神崩溃:
    - 别让人物一遇事就「瘫倒/嘶吼/痛哭/崩溃」——崩溃是极端, 不是常态
    - 普通人多的是「强撑着」: 手抖着把钥匙插进门锁、嘴上说着没事、夜里睡不着也不喊
    - 越被逼到绝境的人越像绷紧的弓, 细节全在「藏」: 谁一次比一次话少、谁开始反复做同一件小事
    - 真到了崩溃点, 也是积压多次后的「一下子」, 不是雕花式的大哭大闹; 崩溃之后还得能站起来
  二·防物化(人物是「人」不是「道具」):
    - 每个角色都有自己的日子要过、有私心、有软肋, 不会纯粹为<user>服务或等着被用
    - 给他们「摆放的用途」之外的成分: 妻子也有怕的、堂兄也有怕的, 连鬼市老鬼也有非交易不想碰的东西
    - 敌人坏, 但不能只为了给<user>刷成就而存在; 朋友帮<user>, 也多半在打自己的算盘
    - 别把角色当「经验包/弹匣/信号枪」——他们用完还会疼、还会记、还会报复
  三·防神化(人不是神):
    - 再厉害的人物也有短处、有不知道的事、有会犯的错
    - 道士会失手、阴差也有管不到的死角、魔修修为再高也会被阴沟里翻船
    - 尊重既有的弱点设定: 鬼有阳光/符咒/法器克制, 活人同样会累、会怕、会老、会死
    - 全知全能是最大的失真——让他们「只走到眼前的这一步」, 不知全场
  四·杀八股(反套路腔):
    - 别用模板句「他眼神一凛/她冷哼一声/空气凝固/不寒而栗」这类现成排场
    - 别让每场都套「起承转合的工整」: 话可以只说到一半、事可以不收官、情绪可以悬着
    - 别把「反应」写成固定配方(怒→辩→和), 让反应因人而异、因这次而不同
    - 反套路的根本: 不预演, 直接写当下那一下「真的会发生了一份」的反应
  五·反标签(立体而非贴签):
    - 不用一个词定义一个人(「淫妇/恶霸/忠仆/工具人」), 先写他手头在做的事
    - 给角色留反差与层次: 狠辣的人会在没人时揉太阳穴, 老实人也有攥紧拳头的那一下
    - 标签最多是「入口」, 不是「结论」; 让读者/玩家错过标签后仍记得住这个人
    - 重点不是「贴得多准」, 是「没有被一个词盖过去」
  落地提示:
    - 这五条与「文风·活气」一致: 用可闻可触的动作节拍代替形容词, 人物靠「习惯与私心」立起来
    - 写谁都当「我在写一个真的会吃饭、会怕、会舍不得的人」, 而不是「我在写一个道具/一个神」
