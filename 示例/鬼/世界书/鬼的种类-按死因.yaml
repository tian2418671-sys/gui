按死因分类:
  缢鬼:
    死因: 上吊而死
    特征: 披头散发, 口吐长舌
    习性: 常引诱有求死之心的人
  溺鬼:
    死因: 落水淹死
    特征: 半透明, 浑身滴水, 发丝漂浮
    习性: 滞留水边, 怨气重者化为水鬼; 怨气极重且不找替身者直接化为厉鬼
  水鬼:
    死因: 溺死滞留
    特征: 眼呈红绿色, 水中力大无穷, 皮肤黏滑
    习性: 需找替身才能转世, 常拉活人下水
  产鬼:
    死因: 难产而死
    特征: 腹部隆起, 阴气缠绕
    习性: 纠缠活着的孕妇, 阻碍其生产
  刀劳鬼:
    死因: 山间被杀
    特征: 口喷剧毒气体
    习性: 被毒杀者不经火烧处理也会变为同类
  疫鬼:
    死因: 瘟疫而死
    特征: 青面, 周身黑气
    习性: 散播瘟疫的恶鬼
  饿死鬼:
    死因: 活活饿死
    特征: 腹大如鼓, 四肢枯瘦
    习性: 投胎前必须吃饱, 缠着活人讨饭, 常出没于饭馆后厨、粮仓
  烧死鬼:
    死因: 火烧而死
    特征: 浑身焦黑, 面目模糊
    习性: 夜间扑向活人取暖, 或报复放火之人
  无头鬼:
    死因: 斩首而死
    特征: 脖颈断口渗血, 常提着自己的头
    习性: 夜行寻头, 遇到活人会讨要头颅
  战死鬼:
    死因: 战死沙场
    特征: 披甲执械, 多为成群阴兵
    习性: 阴兵借道时活人须避让, 常在战场旧地徘徊
  冤死鬼:
    死因: 冤屈而死
    特征: 眼神怨毒
    习性: 怨气重, 求昭雪, 报复真凶
  猝死鬼:
    死因: 突发暴毙
    特征: 面目如生前, 神情迷茫
    习性: 魂体恍惚, 不记得自己已死, 徘徊于死地
  毒死鬼:
    死因: 服毒而死
    特征: 口吐黑沫, 七窍发青
    习性: 想找人陪自己死, 出没于下毒之地
  摔死鬼:
    死因: 高处坠落
    特征: 身形扭曲, 关节反向
    习性: 在高楼、悬崖、桥边徘徊, 惊吓活人失足
  撞死鬼:
    死因: 车祸横死
    特征: 常在路口徘徊, 身上带撞痕
    习性: 惊吓司机, 或寻找替身
  短命鬼:
    死因: 夭折早逝
    特征: 童身, 身高停在死时
    习性: 阳寿未尽, 常显灵提醒活人珍惜寿命
