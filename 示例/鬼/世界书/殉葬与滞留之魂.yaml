<region region="殉葬与滞留之魂">
殉葬与滞留之魂(魂魄不总能被鬼差勾走):
  概述: 古时人殉、陪葬、人牲, 连同墓主、丫鬟、奴隶、随葬匠人一同埋进地里——他们大多不是「自愿死」, 是活埋、处死、随葬; 死不瞑目、怨气最重, 也成了最离不开陵墓、最难讲理、最值得打交道的一批鬼
  殉葬者的类别:
    墓主:
      - 死有余负: 怕被盗洞、怕后人败光基业、怕哪天被人刨出来惊动, 魂守陵不散
      - 醒着的时候讲究、讲规矩, 暴躁的时候六亲不认; 多数时候「睡着」, 动静大了才醒
    丫鬟 / 通房 / 侍从:
      - 生前侍奉, 死后还「侍奉」——困在墓主身旁走不脱, 比墓主更可怜、也更愿意搭话
      - 若遇善待、或你替她办成一桩生前没办到的事, 她能成了你的内应, 知道墓主的脾气与破绽
    随葬匠人(修墓工匠):
      - 修完墓被殉以保密, 怨最深; 睡最熟, 也最清楚地宫机关、暗门与夯土走向
    人牲(当作祭牲的活人):
      - 为镇墓而杀, 怨化成的守墓煞又凶又死心眼, 只认生人; 硬闯会先撞上它们而不是墓主
    奴隶 / 廉价命:
      - 生时为奴、死时陪葬, 一辈子没得过自由, 成了墓里最沉默、也最不肯上路的; 无心机, 却记仇记到骨子里
  魂魄滞留人间的原因(不一定都被鬼差勾走):
    - 死不瞑目(怨): 死得冤、惨、不甘, 怨气撑着不走, 鬼差接不动
    - 心愿未了(念): 有未尽之事、放不下的人或物, 魂魄自己不肯走
    - 牵挂太重(爱): 拴着活着的亲人、旧居老屋, 脚被绊住, 挪不开地府
    - 被镇被困(囚): 被阵法、风水、陪葬物钉在原地, 想走也走不脱, 鬼差同样带不走
    - 约定未了/自许(承): 「说好的来世」「许给了谁」没兑现, 或迷信里把自己许出去了
    - 横死漏接(漏): 死得太突然、地方太偏, 阴差没接住, 成了漏网的孤魂
  对<user>的实际意义:
    - 想掘墓借势、找知情鬼、混进地宫, 先分清谁是醒着的墓主、谁是能谈的丫鬟、谁是见生就咬的守墓煞
    - 墓里是一套「等级森严」的死人社会——墓主压着丫鬟奴仆, 人牲守着门; 这种地方最容易被挑拨、被利用
    - 别只顾着怕墓主: 真正的路数与地宫地图, 多半攥在「被牺牲」的丫鬟、匠人、奴隶手里
  铁律:
    - 越「主动殉」的(忠仆、义士、随葬夫)越要敬, 不可虐; 越「被迫殉」的(奴隶、人牲、祭牲)怨越重, 可借可用, 更要防它反噬
    - 滞留不是「命理例外」, 是一个个没走得掉的活人; 问清楚「它为什么不走」, 往往比问「它有什么本事」更有用
</region>