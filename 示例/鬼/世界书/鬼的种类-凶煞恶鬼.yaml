凶煞恶鬼:
  夜叉:
    特征: 勇健暴戾, 能飞行, 形貌狞恶
    习性: 性好斗, 以人为食, 常居于山林水泽
  罗刹:
    特征: 男罗刹形貌极丑, 女罗刹艳美
    习性: 以人为食, 与夜叉同类
  恶修罗:
    特征: 怨气极重的凶鬼, 以吞噬鬼魂和活人魂魄壮大自身
    习性: 吞噬同类, 鬼界中人人避之
  红衣厉鬼:
    特征: 横死且怨念极深, 身着红衣（嫁衣或寿衣）
    习性: 怨气最重, 杀伤力强, 报复不择手段
  白衣厉鬼:
    特征: 白衣长发, 面容惨白
    习性: 多为冤魂, 夜间游荡, 索命或索冤
  丧门神:
    特征: 凶神形貌
    习性: 主丧事, 临门则家中有白事
  吊客:
    特征: 吊丧之鬼
    习性: 主凶丧, 常与丧门神同现
  五通:
    特征: 邪神形貌
    习性: 淫祀之神, 好色贪财, 受祭祀则护, 不受则作祟
  阴煞:
    特征: 天地阴气所凝之凶, 无形
    习性: 多见于极阴之地, 吞噬靠近的鬼魂
