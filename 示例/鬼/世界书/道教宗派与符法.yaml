<region region="道教宗派与符法">
道教宗派与符法:
  说明: 人间道士的谱系与「吃饭手艺」; <user>作为厉鬼与之周旋, 越懂他们的路数, 越知道哪些符要躲、哪些流程会把你逼进死胡同
  两大宗派:
    全真派:
      - 金代王重阳所创, 以「内丹修炼」为主, 主张「性命双修」, 靠自身修为炼神伏鬼
      - 出家道士, 不结婚、不吃荤、常住宫观; 头戴混元巾(圆帽)
      - 对鬼: 重「炼」不重「请」, 少有花哨符诏, 却能在体内养出一口克制阴煞的正气
    正一派:
      - 源于东汉张道陵所创的「五斗米道」(天师道), 以「符箓斋醮」为主, 擅长画符念咒、祈雨驱鬼
      - 可娶妻、可食荤、可不居宫观(火居道士), 头戴九梁巾等
      - 对鬼: 重「请将」与「用符」, 往往要开法坛、发文书请神将/城隍/土地相助——这正是<user>要提防的「正规军」
  称谓与身份:
    - 通用别称: 道长、道人、羽士、羽客、黄冠
    - 性别: 男称乾道, 女称坤道/女冠
    - 职责: 高功(主持大型斋醮)、火居道士(有家室不住宫观的正一)、乌头道士(专司丧葬)
  法位制度:
    - 道士以所授法箓品阶定高低, 类似官阶; 传统有天真、神仙、山居、出家、在家、祭酒等分法
    - 常见法位由低到高: 正一 → 太玄(五千文) → 洞神 → 洞玄 → 洞真; 法位越高, 能召的神将越多、压阴越狠
  符与箓:
    - 符: 画在纸帛上的神秘符号, 用来召劾鬼神、镇魔压邪、治病安宅 (理瘟符/安宅符/求官符…)
    - 箓: 道士的「执业资格证」与「神将花名册」, 受箓后才能召箓中所载护身神将 (童子箓/益寿箓…)
    - 符的分类: 复文(小字组图)、云篆(模拟云气的天书)、灵符宝符(圈点线条)、符图(天神形象+符文)
    - 画符规矩: 需净身净手净口、摆香案上香请神, 以朱砂黄纸书写; 画时念咒并「存想」神光入笔; 关键在于「符窍」——「画符不知窍, 反惹鬼神笑」, 符可服(烧化冲水)、可贴(门窗/患处)、可焚(烧化)
  捉鬼流程（正一/符箓派的标准战法）:
    - 勘合: 先判断作祟真伪与来头
    - 布坛: 结法坛作为「指挥部」
    - 召将: 以符、咒、诀、罡召遣神将(雷部邓辛张陶、赵公明、王灵官等), 或发文书请城隍土地
    - 追捕: 神将追索鬼祟(神霄派有雷部捉鬼法、咒枣法、十二将远捉法等)
    - 镇压: 捉住后「押入」装水的琉璃瓶并贴符印永久镇压
  对厉鬼(<user>)的实际意义:
    - 医生般的拆解: 会有人「勘合」它是不是在报仇, 再决定要不要管
    - 可躲的: 破隐息符、躲法坛罩不到的阴角、不给神将留「气味」抓住
    - 致命的: 一旦被高功开了坛、召了将、盖上琉璃瓶, 非池中之物也难逃; 认清「供奉道士」多半出自正一天师道, 要防的不是他的符, 是他背后「神将」的路子
</region>