@@if getvar('stat_data.世界.当前区域', { defaults: '' }).includes('小区') || getvar('stat_data.世界.当前区域', { defaults: '' }).includes('花园') || getvar('stat_data.世界.当前区域', { defaults: '' }).includes('超市') || getvar('stat_data.世界.当前区域', { defaults: '' }).includes('商超') || getvar('stat_data.世界.当前区域', { defaults: '' }).includes('街头')
---
<region region="城市日常地点">
城市日常地点:
  普通小区:
    - <user>生前的家所在小区，头七夜妻子与老板偷情处
    - 居民楼、楼道声控灯、楼下小卖部、晾衣杆
    - 饭点时孤魂野鬼在窗外偷吸各家饭菜热气
  高档小区:
    - 神宗家族成员与老板情妇聚居处
    - 门禁森严、保安巡逻、绿化带精致
    - 夜里灯火通明，人多阳气足，鬼魂不敢久留
  花园:
    - 城市公共绿地，白天老人遛弯、晚上情侣散步
    - 树丛阴凉处是野鬼暂歇地
  超市:
    - 日用品与生鲜，人来人往
    - 冷柜区阴冷，夜里有饿鬼吸食冷气与菜肉的气息
  商超:
    - 大型购物中心，商场、影院、餐饮
    - 地下车库与安全通道是鬼魂穿行的捷径
  城市街头:
    - 夜市、天桥、十字路口
    - 十字路口是烧纸祭拜的场所，也是饿鬼等饭的地方

  互动:
    普通小区:
      可做: 潜回旧居盯梢、翻找遗物、头七夜守在窗外看妻子动静
      会遇见: 楼里的孤魂、底下烧纸的家人、守灵的人
      机会: 找回生前证件与念想、从邻里闲谈里听漏家族的消息
      风险: 白天阳光灼人; 楼下看门的狗能嗅到异样
    高档小区:
      可做: 跟踪神宗成员、蹲守在绿化带、混进地下车库
      会遇见: 神宗家族成员、老板情妇、阳气足的保安
      机会: 摸清某人出门归家的规律、截听电话、截获丢弃的纸张
      风险: 灯火通明阳气重, 待久会难受; 贴身保安感觉异常灵敏
    花园:
      可做: 夜里在树丛歇脚、听人闲聊、吓唬落单的人
      会遇见: 情侣、夜跑的人、清晨浇水的老人
      机会: 听带消息的闲话、蹭烧余的凉气、找安静处躲避
      风险: 太贴近生人会惊扰他们; 白天晒到会灼伤
    超市:
      可做: 躲进冷柜区吸冷气、吓店员、趁乱摸到档案架
      会遇见: 夜班店员、补货工、深夜买菜的醉客
      机会: 吸菜肉的气息充饥、借安检死角、偷听进出的人说话
      风险: 灯亮人多阳气重、货架间难藏长久
    商超:
      可做: 借地下车库与安全通道赶路、在影院影厅里吓人、混在人群中穿梭
      会遇见: 形形色色的顾客、少数能通灵的怪人、管理秩序的保安
      机会: 掩人耳目办不宜见光的事、顺走无人注意的信物、听墙角
      风险: 人流阳气重, 停留过久会发虚; 严防摄像头与巡逻
    城市街头:
      可做: 守在十字路口等纸钱香火、吓夜归人、尾随目标回家
      会遇见: 烧纸的人、夜摊老板、偶来巡查的阴差
      机会: 捡香火纸钱、听街头八卦、悄悄跟到住处摸清底细
      风险: 阴阳交界处阴差巡逻较勤、天将亮时阳气回升不可恋战

</region>
