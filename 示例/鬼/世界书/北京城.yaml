北京城:
  概述: 故事主舞台, 现代都市, 阴阳两界并存的表层
  氛围:
    - 白天是普通人的北京, 人流车流, 阳光灼人, 鬼魂缩进阴影
    - 夜晚是鬼魂的北京, 阴气下沉, 无主的鬼魂在夹缝中游荡
  主要地点:
    - 出事路口: <user>车祸撞死处, 第一幕觉醒地, 柏油路上留着一道拖得很长的刹车痕
    - 桥: 第七幕终局地
    - 主角旧居: 生前住所, 妻子住处
    - 家族老宅: 神宗家老宅, 含祖坟与书房密室
    - 家族私立医院: 地下一层旧太平间困魂
    - 鬼市: 废弃商业楼改建的鬼魂交易地
    - 废弃防空地道: 躲避恶鬼的藏身处
    - 老城区高架桥下: 与恶鬼对峙处
    - 城中别墅: 妻子与老板住处
  势力分布:
    - 神宗家族: 盘踞老宅与医院, 三重防护
    - 天师道: 供奉道士出身, 受家族雇佣
    - 鬼市势力: 守门鬼、交易区、禁区恶鬼
    - 地府阴差: 巡查人间, 缉捕漏魂
  社会互动总览:
    夜里可做的人间事:
      - 守在十字路口、夜市口等纸钱香火, 蹭一点人间烟火
      - 混进夜摊、饭馆后厨偷吸饭菜热气喂自己
      - 尾随夜归的人回家, 摸进人家看生活的边角, 顺手听一耳朵闲话
    阴阳两界的社交:
      - 人间: 假道士是<user>在人间的接口; 能看见鬼的人(濒死、出马、通灵)稀少而珍贵, 攀上一个就多一条眼线
      - 鬼界: 鬼市、老鬼地盘、医院太平间是据点; 跟老鬼、卖情报鬼、财务女鬼打交道换消息
      - 香火点: 香火旺的庙宇、路口、旧宅是鬼魂的「食堂」, 也是与庙祝、居士周旋的场合
    势力往来:
      - 神宗家族: 绕不开的仇家, 白天避, 夜里伺机
      - 地府阴差: 少惹, 犯了规矩会来查
      - 散修 / 魔修: 当心他们拿你炼器, 遇上先掂量再说话
    城市节奏:
      - 白天一座城都归活人, 鬼只能缩在阴影里
      - 天黑之后这座城市才通鬼: 夜市、路口、天桥、老楼、地铁末班车全开了路
    建筑互动:
      - 老楼天台、写字楼通风道、地下车库、废弃商场是鬼穿行的捷径
      - 亮着灯的高层窗里偶尔坐着能通灵的人, 别轻易惊动
      - 每栋楼的第一层与顶层阳气最弱, 也最容易藏东西、藏人
    触发插曲:
      - 夜里路过某个老四合院, 听到里头在吵架或炒菜, 往往藏着能顺手利用的人或消息
      - 地铁末班车、夜班公交上常有困倦的生魂, 是打听城市的现成开口
  真实地标的社会互动:
    皇家宫殿与园林:
      - 故宫(紫禁城): 白昼归游人, 入夜后红墙空落, 历代宫人的残影还在角落里; 方位气势太盛, <user>只敢在角楼与护城河沿岸徘徊, 听晚风里断断续续的旧话
      - 天安门广场: 国之重地、阳气极重, 鬼敬而远之; 广场边沿地下反而冷, 是阴差换班的歇脚处
      - 天坛: 皇帝祭天之所, 回音壁夜里能把鬼的低语来回弹; 隔朝代的威仪与香火仍压着鬼, 非必要不近
      - 颐和园 / 北海公园: 皇家园林夜禁, 水面、长廊与石舫阴凉, 是残魂听曲歇气的好地界
      - 中山公园 / 劳动人民文化宫: 原是社稷坛与太庙, 神祠之地; 夜里神位还在, 鬼不敢久留
    胡同与市井:
      - 南锣鼓巷 / 五道营 / 国子监街: 游客退去的深夜, 胡同里的孤魂守着自己的老宅, 想回家的鬼会在旧墙根反复打转
      - 什刹海 / 大栅栏: 水边与商街是夜里话最多的地方, 偷听能捡到消息; 后海的夜是活的
      - 砖塔胡同 / 史家胡同: 老四合院门槛留着旧主人家的灯笼气, 忽然亮灯的窗里偶尔坐着能看见鬼的人
    古迹与地标:
      - 中轴线: 从钟鼓楼直贯到永定门的纵线, 夜里是阴差拨时辰的线路, 鬼走多了会踩错路
      - 钟鼓楼: 元明清报时中心, 鼓声停歇多年, 楼里仍留着报时的回音; 能通灵的人在楼上能听见旧日更声
      - 雍和宫: 藏传佛教大寺, 佛像恒久、香火不断; <user>路过须绕行, 靠太近会被佛光烫
      - 明城墙遗址: 五百年城砖, 砖缝里嵌着历代亡魂的执念, 是鬼听旧城故事的地方
    博物馆与故居:
      - 中国国家博物馆: 千年器物沉淀的气夜里厚重如鼎, 鬼进去会被压得说不出话
      - 老舍 / 谭嗣同 / 康有为 / 齐白石 / 纪晓岚故居: 文人名士旧宅, 夜里常亮着一盏看书的灯; 那点残留的人气, 是鬼能搭上话的少有可能
    宗教与祭祀:
      - 法源寺 / 潭柘寺 / 广济寺: 古寺香火鼎盛、佛像庄严; 鬼只敢在庙墙外听晚课的木鱼声
      - 白云观 / 东岳庙: 道观神位多、符箓旺, 最忌乱闯; 却有道人算得通阴, 是少数能谈买卖的活人
    鬼视角小贴士:
      - 白天这些地方阳气太盛, 只能夜里去; 香火越旺处, 鬼越要绕行
      - 别动庙里炉灰与神位前的供品——那是神明和亡魂的, 沾了因果阴差会找上门
      - 想找人搭话去胡同与故居, 想听旧事去城墙与园林水边, 想避谁就躲进庙宇佛光外三丈
