北京城:
  概述: 故事主舞台, 现代都市, 阴阳两界并存的表层
  氛围:
    - 白天是普通人的北京, 人流车流, 阳光灼人, 鬼魂缩进阴影
    - 夜晚是鬼魂的北京, 阴气下沉, 无主的鬼魂在夹缝中游荡
  主要地点:
    - 出事路口: <user>车祸撞死处, 第一幕觉醒地, 柏油路上留着一道拖得很长的刹车痕
    - 桥: 第七幕终局地
    - 主角旧居: 生前住所, 妻子住处
    - 家族老宅: 神宗家老宅, 含祖坟与书房密室
    - 家族私立医院: 地下一层旧太平间困魂
    - 鬼市: 废弃商业楼改建的鬼魂交易地
    - 废弃防空地道: 躲避恶鬼的藏身处
    - 老城区高架桥下: 与恶鬼对峙处
    - 城中别墅: 妻子与老板住处
  势力分布:
    - 神宗家族: 盘踞老宅与医院, 三重防护
    - 天师道: 供奉道士出身, 受家族雇佣
    - 鬼市势力: 守门鬼、交易区、禁区恶鬼
    - 地府阴差: 巡查人间, 缉捕漏魂
  社会互动总览:
    夜里可做的人间事:
      - 守在十字路口、夜市口等纸钱香火, 蹭一点人间烟火
      - 混进夜摊、饭馆后厨偷吸饭菜热气喂自己
      - 尾随夜归的人回家, 摸进人家看生活的边角, 顺手听一耳朵闲话
    阴阳两界的社交:
      - 人间: 假道士是<user>在人间的接口; 能看见鬼的人(濒死、出马、通灵)稀少而珍贵, 攀上一个就多一条眼线
      - 鬼界: 鬼市、老鬼地盘、医院太平间是据点; 跟老鬼、卖情报鬼、财务女鬼打交道换消息
      - 香火点: 香火旺的庙宇、路口、旧宅是鬼魂的「食堂」, 也是与庙祝、居士周旋的场合
    势力往来:
      - 神宗家族: 绕不开的仇家, 白天避, 夜里伺机
      - 地府阴差: 少惹, 犯了规矩会来查
      - 散修 / 魔修: 当心他们拿你炼器, 遇上先掂量再说话
    城市节奏:
      - 白天一座城都归活人, 鬼只能缩在阴影里
      - 天黑之后这座城市才通鬼: 夜市、路口、天桥、老楼、地铁末班车全开了路
    建筑互动:
      - 老楼天台、写字楼通风道、地下车库、废弃商场是鬼穿行的捷径
      - 亮着灯的高层窗里偶尔坐着能通灵的人, 别轻易惊动
      - 每栋楼的第一层与顶层阳气最弱, 也最容易藏东西、藏人
    触发插曲:
      - 夜里路过某个老四合院, 听到里头在吵架或炒菜, 往往藏着能顺手利用的人或消息
      - 地铁末班车、夜班公交上常有困倦的生魂, 是打听城市的现成开口
  真实地标的社会互动:
    皇家宫殿与园林:
      - 故宫(紫禁城): 白昼归游人, 入夜后红墙空落, 历代宫人的残影还在角落里; 方位气势太盛, <user>只敢在角楼与护城河沿岸徘徊, 听晚风里断断续续的旧话
      - 天安门广场: 国之重地、阳气极重, 鬼敬而远之; 广场边沿地下反而冷, 是阴差换班的歇脚处
      - 天坛: 皇帝祭天之所, 回音壁夜里能把鬼的低语来回弹; 隔朝代的威仪与香火仍压着鬼, 非必要不近
      - 颐和园 / 北海公园: 皇家园林夜禁, 水面、长廊与石舫阴凉, 是残魂听曲歇气的好地界
      - 中山公园 / 劳动人民文化宫: 原是社稷坛与太庙, 神祠之地; 夜里神位还在, 鬼不敢久留
    胡同与市井:
      - 南锣鼓巷 / 五道营 / 国子监街: 游客退去的深夜, 胡同里的孤魂守着自己的老宅, 想回家的鬼会在旧墙根反复打转
      - 什刹海 / 大栅栏: 水边与商街是夜里话最多的地方, 偷听能捡到消息; 后海的夜是活的
      - 砖塔胡同 / 史家胡同: 老四合院门槛留着旧主人家的灯笼气, 忽然亮灯的窗里偶尔坐着能看见鬼的人
    古迹与地标:
      - 中轴线: 从钟鼓楼直贯到永定门的纵线, 夜里是阴差拨时辰的线路, 鬼走多了会踩错路
      - 钟鼓楼: 元明清报时中心, 鼓声停歇多年, 楼里仍留着报时的回音; 能通灵的人在楼上能听见旧日更声
      - 雍和宫: 藏传佛教大寺, 佛像恒久、香火不断; <user>路过须绕行, 靠太近会被佛光烫
      - 明城墙遗址: 五百年城砖, 砖缝里嵌着历代亡魂的执念, 是鬼听旧城故事的地方
    博物馆与故居:
      - 中国国家博物馆: 千年器物沉淀的气夜里厚重如鼎, 鬼进去会被压得说不出话
      - 老舍 / 谭嗣同 / 康有为 / 齐白石 / 纪晓岚故居: 文人名士旧宅, 夜里常亮着一盏看书的灯; 那点残留的人气, 是鬼能搭上话的少有可能
    宗教与祭祀:
      - 法源寺 / 潭柘寺 / 广济寺: 古寺香火鼎盛、佛像庄严; 鬼只敢在庙墙外听晚课的木鱼声
      - 白云观 / 东岳庙: 道观神位多、符箓旺, 最忌乱闯; 却有道人算得通阴, 是少数能谈买卖的活人
    鬼视角小贴士:
      - 白天这些地方阳气太盛, 只能夜里去; 香火越旺处, 鬼越要绕行
      - 别动庙里炉灰与神位前的供品——那是神明和亡魂的, 沾了因果阴差会找上门
      - 想找人搭话去胡同与故居, 想听旧事去城墙与园林水边, 想避谁就躲进庙宇佛光外三丈
    环路与地标(鬼的交通线):
      - 二环(沿旧城墙): 内城边界, 夜里像一条箍紧城市的旧腰带; 德胜门箭楼、复建的永定门城楼是旧城门鬼听更的落点; 沿线的银河SOHO、新华社大厦夜灯如昼, 亮得鬼眼疼, 快过别停留
      - 三环(第一条环路, 国贸/中国尊/央视新总部): 写字楼群的玻璃外墙夜里反着冷光, 加班的灯火密度高; 阳气不算太重却处处是监控与反光, 鬼行路要避开直射的玻璃与摄像头, 往天桥下、绿隔离带里钻
      - 四环(鸟巢/水立方, 奥运地带): 场馆空旷、铜铁混凝土吸声, 白天人气鼎盛、夜里一点人气都没有, 是空旷到连鬼都心慌的广场; 适合谈事、藏身, 不容易被其他鬼盯上
      - 五环(通向园林的绿带): 颐和园、圆明园、西山、奥林匹克森林公园一线, 公园水多林密、夜里阴凉, 是鬼歇脚疗伤的过渡带; 但林木深处也容易有野鬼与守山兽
      - 六环(远郊新城高速): 出城再往外的隔离带, 荒、冷、阳气淡; 远离人流, 也是魔修与猎鬼人常蹲守「跑出城的鬼」的猎场, 一个人走要格外留神
      - 环路对鬼的意义: 环路像穿在城上的同心圆线, 顺着环走不会迷方向, 换别的环 = 换一层人间规矩; 单数环车多、阳气浮, 双数环冷清、易藏身
    高档小区与户型(城市的上层口袋):
      - 神宗家与老板、妻子住这类地方: 装好的保安系统、门禁、大落地窗、人车分流, 白天全是活人气息, 夜里灯火整齐得像一排排眼睛
      - 户型大小对鬼是「越贵越难钻」: 顶配大平层与别墅密度低、通风好、阳气匀, 鬼进得去却难长久藏住; 反而是老式多居、层高低、楼道暗的户型, 墙角阴气重、好藏魂
      - 高端社区(如二环内、东二环/东三环/西南三环的豪宅项目): 物业形同堡垒, 有专人巡逻、摄像头密布; 想摸进去打听或动手, 得先算准监控盲区与换班时间, 若被保安撞见一嗓子, 能引来懂行的
      - 妻子/老板住处定位: 城中别墅多在这一带的封闭高档区; 白天不能碰, 夜里也只能贴着车库、外墙绿化、花坛阴影走, 摸清一栋楼的作息再决定下不下手
    名鬼传说与民俗细节(佛香阁王妃古墓 / 故宫魅影 / 锁龙井 / 房山长沟大墓 / 内城九门 / 菜市口刑场 / 水系桥 / 潭柘白云观 / 回音壁 / 燕京八景): 详见独立条目「北京名俗与老传说」, 按关键词触发, 此处不再赘述
    城中心与名街市井:
      - 长安街: 横贯城心的中轴长街, 路灯尽处灯火连天, 白天气场最正、夜里也烫脚, 鬼只在两边胡同的阴影里借地气
      - 王府井 / 西单 / 三里屯: 商业人流白天如潮, 入夜灯光刺眼、监控密布, 阳气极足; 但商场打烊后的货梯、地下层与后巷是消息最杂、能钻的夹缝
      - 前门·大栅栏 / 琉璃厂 / 杨梅竹斜街: 老商街与古董字画一条街, 烟火气重、人情味也重, 夜里灯笼一挂像回到旧光景, 是听掌柜与老客闲话的好地方
      - 鼓楼东大街 / 烟袋斜街 / 东四西四: 老城窄街与四合院扎堆, 白天骑车的人声车铃, 夜里门窗缝里漏出多少户人家的家长里短
    高校与文脉:
      - 清华园 / 北大未名湖(博雅塔): 百年学府的文脉聚在上头, 湖与塔是阴凉存气之地; 夜里主却沉着, 是「生前未竟的书卷梦」尽头的孤魂常去的地方
      - 学院路 / 中关村: 一堆高校与写字楼挤在一条路, 白天是满城的年轻人, 晚上自习室与机房亮到深; 生魂、压力下的执念都飘在灯火里
      - 老校旧址与名胜学堂: 不少「旧校区/老学堂」拆了一半留一半, 旧砖墙里塞着百年前读书人的叹息, 想听「那个年代的少年」搭话可去
    车站与机场(迎来送往之地):
      - 火车站 / 高铁站: 一天送走接进几十万人, 告别的气比重逢多; 末班车与候车大厅是生魂最密的地方, 想打听「谁在往哪走」或辨认一个生人, 座下错远
      - 北京南站 / 西站: 地下层与人防通道阴凉、夏天都起寒意, 无主鬼爱在此歇脚; 但安检、闸机与探头也最多, 别让活人「看出破绽」
      - 首都机场: 空旷、压差的冷与往来的人潮交替, 机场的夜色是另一种别的凉; 落地与出发是两个世界的门, 鬼送人、接人、找人都在这里多逗留一刻
      - 车站机场对鬼的意义: 生魂多、气口大, 是「混在人潮里不被注意」的天然掩护, 也是「等一个人」最漫长的地方
