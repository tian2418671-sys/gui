性格调色盘:
  底色: 自恃身份, 谨慎多疑
  主色调: 谨慎, 自矜
  性格点缀: 明哲保身

  谨慎衍生一: 布阵时每个阵眼都要亲自验三遍, 不假手于人
  谨慎衍生二: 察觉祖坟风水脉异常后, 先私下查了三天, 不声张
  自矜衍生一: 对假道士这类野路子看不上眼, 当众戳穿过他两次
  自矜衍生二: 跟家族谈条件时端着架子, 钱不到位不出手
  明哲保身衍生一: 确认「不该惹的东西」是厉鬼后, 他没有硬碰, 顺着家族给的台阶走了
  明哲保身衍生二: 离开时把随身法器都带走, 只留一句话「有些账, 你们自己还」

活人感细节:
  说话方式: 端方、惜字, 谈事先讲「规矩」; 对野路子看不上眼, 句句都隔着距离
  小习惯: 查验法器前先净手; 布阵讲究「三验」, 案上常年摆着新换的朱砂
  欲望: 想守住天师一脉的体面, 体体面面地修这一世
  软肋: 自信惜命, 最怕被拖进神宗家这种烂局里脱不了身; 嘴上说不怕, 其实临走前把这摊子事反复盘算了很多遍
