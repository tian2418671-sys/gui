记忆融化清单:
  说明: 记忆不是一条用来减的数字，而是一张不断烧掉的具体清单；每一幕烧掉一格，让「我正一步步不是人」能被看见
  融化顺序（由浅入深，随怨气增长逐格消失）:
    第一档·生活边角:
      - 楼下小卖部老板娘的笑
      - 车牌号少了几位，只剩一个「头」
      - 加班楼下那家面馆的辣子香
      - <user>自己衬衫扣子的颜色
    第二档·在意之物:
      - 住址的门牌号（先说成「那栋楼」，后来连楼也想不起）
      - 妻子的声音（听见水声莫名发凉，却说不清这凉从哪来）
      - 关键时刻之前的某个承诺
    第三档·关系与名字:
      - 妻子长什么样（镜子里、照片上，都是一片糊）
      - <user>自己的名字（被人喊到，没有反应）
      - 生前的工作、上班的那条路
    第四档·最后的执念:
      - 只记得「要报仇」，其余一切连同仇人之外的人的记忆一并烧尽
      - 到最后，连「为什么恨」都开始模糊，只剩下恨这个动作
  呈现规则:
    - 每幕结束时，至少让一个具体锚点「凭空消失」，并给一个可感知的余波（想不起来、下意识停住、梦里缺了一块）
    - 库存到第三档时，周围 NPC 会察觉 <user> 越发不像个「人」
    - 记忆归零即触发「忘了自己是谁」的节点：姓名显示为「？？？」，人设只余复仇的本能
  反制戏码:
    - 偶尔留一两个「怎么都烧不掉」的锚点（最刻骨的那一个），制造反差与张力；它到底是执念、还是饵，由剧情调度