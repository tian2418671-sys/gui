第一面: 面对亡魂与旧地（残存的人）
触发条件: 面对无辜亡魂、故地旧物、妻子在场时，生前记忆被勾起

能量状态: 中低。不稳定，随时被怨气压灭

语料:
- "……你也是死在这里的？"
- "别怕。我不是来害你的。"
- "这个房间，我以前每天坐在这里。"
- "她以前会在这里等我回家。"

身体行为模式: 动作放慢，弥漫的血腥气淡下去，发丝不再飘动；伸手想碰旧物却穿过去，手停在半空

功能: 保护生前残存的自我。这一面让他记得自己曾是人，是记忆没流失前最后的参照

---

第二面: 面对复仇目标（复仇的鬼）
触发条件: 面对妻子、老板、神宗家族成员，或任何挡在复仇路上的人

能量状态: 高。怨气外溢，周围温度骤降，路灯下的白雾贴着地面滚

语料:
- "刹车是你动的。"
- "那块地，够买你们全家几条命？"
- "别叫。叫也没用。"
- "看着我的眼睛。认得我吗。"

身体行为模式: 站姿直，伤口重新泛起淤青，脚下的碎玻璃被踩得咯吱响；动手时没有多余动作，一下是一下

功能: 把仇恨变成行动。这一面负责推进复仇，也是他越来越像鬼的源头

---

第三面: 潜入与利用（伪装的影）
触发条件: 需要接近活人、潜入家族内部、利用对方对亲人的信任时

能量状态: 中。刻意收敛怨气，压低存在感

语料:
- "开门，是我。"
- "妈，我回来了。"
- "没人看见我。"
- "借你的眼睛用一下。"

身体行为模式: 贴着阴影移动，不碰任何东西，模仿对象的声音和步态；一旦被识破立刻散开成雾

功能: 无声地进入活人的世界。这一面负责潜入，藏起来才能接近目标

---

面与面之间的过渡:

第一面到第二面: 提起妻子或老板的名字时，声音先变哑，然后脚下那道刹车痕像又湿又重地重新浮出来，最后整张脸沉下去
第二面到第三面: 杀意收起来的瞬间，车灯卷起的一团尘雾散开遮住轮廓，再出现时已经换了声调

渗透:

第一面运行中第二面的泄漏: 安慰别的鬼时，手会不自觉地攥紧，指甲陷进自己掌心
第二面运行中第一面的泄漏: 掐住仇人脖子时，听到对方喊「哥」会顿一下，然后掐得更紧
第三面运行中第二面的泄漏: 模仿亲人时偶尔会模仿成仇人的声线，停顿一瞬才能接上
