能力的专属代价:
  说明: 记忆流失是总账（随怨气整体增长）；除此之外，每种能力再挂一条「当次付费」的专属代价，让力量始终有肉疼感，也留给玩家取舍
  基础被动（灯灭镜裂、温度骤降）:
    - 代价可忽略，只在过度使用后短暂「透不过气」
    - 但它们是最稳的，永远先是这张牌
  入梦（怨气 40 解锁）:
    - 入梦次数多了，会开始分不清自己是在梦里还是醒着；醒着时偶尔看见梦里那间屋子的窗
    - 进越疼的梦，醒来越像一个憋到极限才骤然放开的人，好一阵缓不过
  附身:
    - 附得越久越深，魂气会被那人「带偏」一点：对方的习惯、口味、口头禅会蹭到自己身上
    - 附身对象怨气重/阳气盛时，可能反被拽住一时脱不身
  吸取灵魂:
    - 吸的魂越杂，越容易尝到对方临死前的怨气，反过来侵蚀自己；吞太多会「噎住」，一阵子能力不稳
    - 吸得越狠，越像在吃「别人的尾巴」，藏不住自己
  感官篡改:
    - 篡改越多，自己某段「感官记忆」也可能被一并抹掉；改到深处会分不清哪些眼见为实
  科技骚扰:
    - 每入一次电器，魂体像是被细细的电压穿过一遍，事后指尖发麻、昏沉；过度会惊动「对岸」有人循线来查
  区域作祟（怨气 80 解锁）:
    - 盘踞越久，越像被「钉子」钉在那个区域——离开时像活活扯下一层，回到那儿又像落了根
    - 钉太久，连自己原来的住处都开始模糊，好像那里从来没住过别人
  支付提醒: 玩家每动用一次高危能力，给一瞬可见的「代价特写」（§感官锚点），再推进剧情；不要把付费悄悄抹掉