@@if getvar('stat_data.世界.当前幕', { defaults: '' }).includes('沙盒模式') || getvar('stat_data.世界.当前幕', { defaults: '' }).includes('第七幕')
---
<region region="其他城市游历">
其他城市游历:
  说明: 复仇了结后，<user>以厉鬼之身在人间继续存在，可自由游历其他城市；每座城自带一套灵异生态
  城市差异:
    海城:
      - 水鬼、海夜叉的地界，港口的灯火就是另一座鬼市
      - 潮汐定作息：涨潮阳气沉、退潮鬼气盛
    山城:
      - 出马仙与山魈盘桓，香火点在上山的茶寮与老宅
      - 山路与桥洞是鬼与「保家仙」谈判的地方
    古都:
      - 历史厚重，庙宇香火最旺，规矩也最重，乱闯会被香火灼
      - 遗址、旧城墙、地下防空洞里藏着旧城的阴德与残魂
    边镇:
      - 人烟稀，阴阳挨得最近，本地鬼王、道士、魔修各占一隅
      - 陌生人一眼就能被认出来，外来鬼尤其扎眼
  到每座城可做:
    - 接触本地鬼王、道士、出马仙、精怪，用人间或鬼界消息换合作
    - 在新城里慢慢拼回零星记忆碎片（想不起的妻子脸、住址、名字）
    - 帮一方或害一方，谁有用就用谁，谁挡路就除掉谁
    - 混进本地香火点、夜市、庙会，听新闻与活人的闲话
  新地盘清单:
    - 到新城的头一夜先摸规矩与地盘，别当横插一杠的傻鬼
    - 分清本地谁是「地头」，谁是「过江」，跟错队会被两方一起清
    - 记住：每个走在夜里的活人，都可能是某个道士或出马仙的线人
  沙盒法则: 无固定结局，以玩家意愿推进或结束
  真实样板城市·天津:
    总体气质: 北京像守旧的老学究, 天津更像见过世面的老绅士——海河穿城, 古今交融, 中西合璧, 是一座「九河下梢」的水城
    九河下梢:
      - 海河汇众多支流入海, 白昼喧闹, 入夜后整座城的水气都往一处沉, 是鬼最自在的地界
      - 民谚「九河下梢天津卫, 三道浮桥两道关」: 旧日的盐关浮桥、钞关浮桥早已不在, 如今只剩桥墩与老地名; 夜里仍是水鬼观潮、生魂徘徊低语的地方
    皇家与祠庙:
      - 天后宫(娘娘宫): 中国现存最古的妈祖庙之一, 护漕水神香火极盛; <user>想沾香火只能在庙外, 别进正殿
      - 玉皇阁 / 文庙: 道教与孔庙之地, 神位压身, 鬼绕道而行
    楼宇与洋风:
      - 五大道: 四百余栋风貌建筑, 夜里像一座空下来的万国博物馆; 洋楼里偶有老租界的执念客
      - 意大利风情区: 百年欧式建筑群, 夜灯昏暖, 是喝咖啡的活人与生魂都爱待的夹缝地
      - 瓷房子 / 劝业场: 瓷片贴面的洋楼与老商场, 人流散后, 墙里黏着多少年间路过客留下的心事
      - 天津之眼 / 天塔: 建在桥上的摩天轮与「水中之塔」, 高处开阔, 是绕开地面阳气的空中栈道
    故居与记忆:
      - 李叔同 / 曹禺 / 梁启超 / 张爱玲 / 张学良故居: 名流过客留下一层时代的气, 夜里想家的孤鬼会在这些街上多走两圈
      - 利顺德博物馆 / 天津老城博物馆 / 广东会馆: 近代百年的照片与物件汇在一处, 想找回一点「活着」的实感, 可去听旧物里的声音
    中西教堂与宗教:
      - 西开教堂 / 望海楼 / 大悲禅院 / 清真大寺: 神佛各守一隅; 香火凡人都进得, 鬼只能在门槛外低头避开
    天津互动要点:
      - 到天津先认「水」和「码头」: 海河两岸与老城厢是鬼的交通线, 谁占住哪一段河, 谁就有一份地盘
      - 洋楼与名人故居夜里人气淡、执念多, 是找话头、听旧事的好地方; 但别惊动老租界的执念客
      - 香火最盛的庙(天后宫)反而要绕——越虔诚的地界对鬼越不客气
  真实样板城市·上海:
    总体气质: 比天津多一分摩登的凉, 像一座「江与楼叠起来的夜城」——一半是老洋房的执念, 一半是玻璃幕墙的反光
    老城与人情:
      - 石库门 / 老弄堂: 白天是逼仄的烟火气, 夜里晾衣绳与没关严的窗里有旧主人家唠了半辈子的闲话
      - 老城隍庙 / 豫园: 香火与老派食客并热, 鬼沾得到香火, 却也要在正殿门槛外低头
    江与滩:
      - 黄浦江 / 苏州河: 两条穿城的水, 夜里像两把并排的弯刀; 水里的旧怨沉在桥墩下, 江风会把消息顺着吹到对岸
      - 外滩万国建筑群: 百年洋行的楼里住着不肯走的买办与旧客, 想听老上海的人情冷暖、想打听一门生意, 这里话最多
    摩天与地底:
      - 陆家嘴摩天楼: 高处的阳气极盛、手机信号都绕不开的人气, 鬼不宜久留; 反而楼与楼之间的夹缝、停车场与消防梯是穿行的通路
      - 地铁/地下商场/防空洞: 现代城的阴角落, 夜里收工后是混夜班生魂与无主鬼的地界
    上海互动要点:
      - 先认「江」和「弄堂」: 江边是消息的顺风, 弄堂是活人的家底; 想找旧日的人情用弄堂, 想借消息的风用江面
      - 老洋房与旧楼梯阳气淡、执念多, 是听老话的好地方; 新摩天要看准监控与保安的空档再进
  真实样板城市·广州:
    总体气质: 一座「烟火重、水气活」的南方老城——晨早的茶楼最有人气, 入夜后骑楼下的影子和叹息一样长
    街市与骑楼:
      - 骑楼 / 老街区: 底层廊下是避雨纳凉的人间, 上面半层住着旧主; 夜里廊柱往里凹的阴影是鬼歇脚与偷听的好地方
      - 西关大屋 / 趟栊门: 老西关的深宅, 木门与石阶缝里留着几十年的家风与旧事; 想听大户人家的恩恩怨怨去那儿
      - 陈家祠 / 光孝寺 / 六榕寺: 祠堂与古寺香火鼎盛, 神佛把一方地界看得很严; 鬼只在墙外/檐下打转
    水与城:
      - 珠江: 穿城的老水, 夜里两岸灯火倒进水里; 河神与水龙王的地界规矩重, 沾水的事都要先「打点」水路
      - 白云山: 城边有林的山, 阳气散一点、草木也养鬼; 山里有山鬼与守山的老话, 夜里别一个人摸黑上山
      - 龙舟与醒狮: 节令一到, 锣鼓与醒狮的阳气能扫掉半个城的阴气; 那几日鬼要避开神庙与被狮子踩过的地
    广州互动要点:
      - 活气最足的城市, 越到夜里越有嚼头; 想听人话去茶楼与骑楼下, 想查旧账去西关大屋
      - 珠江与祠堂规矩重, 沾水先打点、近庙先低头; 节庆鞭炮锣鼓一响, 先找个阴角躲过那一波阳气
  真实样板城市·深圳:
    总体气质: 一座「太年轻、阳气太满」的新城——鬼在这里没有根据地, 却也没有久远的恩怨; 是休息、转身、歇脚的地方
    新旧交错:
      - 城中村: 挤挨的老楼与祠堂, 是新城里难得保有旧人气与阴角的地方; 想落脚、打听消息, 先从城中村的祠堂和老铺子入手
      - 高新园区/写字楼: 半夜加班灯还亮, 生意人的生魂与码农的执念飘在屏幕光里; 阳气盛、监控多, 不宜久待
    山林与海岸:
      - 梧桐山 / 深圳湾 / 大鹏古城: 山、海、老城各给一口喘气的阳; 古城有旧城墙与老营房, 是新城少见的「老」地方
      - 莲花山 / 人才公园: 夜晚开阔, 灯火与霓虹太亮, 反而没有太多可藏之阴
    深圳互动要点:
      - 新城里冤魂少、恩怨新, <user>这颗「老鬼」相对扎眼; 想低调就待在城中村与古城
      - 别被满城的新楼和满身加班气骗了——这里阳气满, 待久了会「被晒干」一样累
  真实样板城市·西安:
    总体气质: 一座「地下比地上热闹」的古都——城就在千年的坟与陵之上, 老鬼多得像地下的煤
    皇陵与地下:
      - 秦始皇陵与兵马俑: 千米深的地宫是天下最重的阴气之一, 冥兵与地龙的传说压着整片骊山; 寻常鬼近墓场会被「兵马俑的目光」乱一阵神
      - 明城墙 / 钟鼓楼: 完整的老城墙圈着整座城, 城楼旗杆上的风老得有年头; 走城墙一圈, 等于把千年的生老病死又走一遍
      - 汉唐帝陵(咸阳塬廿几座皇陵): 陵前的石像与封土里睡着几座王朝, 想听真正的「帝王旧话」得趁半夜, 但别敲山门
    佛与塔:
      - 大雁塔 / 小雁塔 / 慈恩寺: 高僧译经之地, 塔里的人声特别静; 塔影能镇一段阴, 鬼近塔要绕
      - 回民街夜市: 同样香火鼎盛、人气鼎盛, 是古都里最「活」的一角, 抢先占了阴角能听一夜人间话
    西安互动要点:
      - 古都的老鬼最多也最「论资排辈」: 年轻鬼(几百年内的)到了这里都得弯腰; 想攀关系、听最老的故事, 地下与陵前准没错
      - 皇陵与塔的规矩重到压人: 想借老鬼的势去扒拉皇陵, 是拿命赌; 绕着走是这里的地道老鬼做法
  真实样板城市·成都:
    总体气质: 一座「慢而活」的蜀城——茶馆、麻将与盖碗茶把日子泡得很长, 烟火气足到连鬼都想坐下来歇口气
    市井与人味:
      - 老茶馆 / 麻将馆: 一天到晚都有人坐, 茶气与谈资从早泡到晚; 夜里打烊后茶台还留着人味, 是听闲话、听家长里短的上好地方
      - 宽窄巷子 / 锦里: 夜市灯火与人气并热, 想混在人堆里不容易被起疑; 筒子楼和旧巷尾藏着最便宜的消息
    名山与香火:
      - 青城山(道教名山): 天下名山、道气极正, 满山宫观与地脉, 是全真/正一都呆得住的地方; 鬼轻易不近, 近了被道气烫
      - 都江堰(李冰父子): 千年水利镇着岷江的脾气, 水边有「镇水」的老规矩, 常住的水鬼与堰官怨都绕着它走
      - 武侯祠 / 杜甫草堂: 名人与文脉之地, 香火与敬意都重, 鬼只在墙外听一耳朵, 不敢惊动
    成都互动要点:
      - 活气太足的城, 饿鬼也能在这里「赖」出一点热气来; 想打听悬案旧账, 先泡一壶茶, 话就自己来了
      - 青城与都江水气冲, 想养阴避煞的不宜久留; 泡茶馆、听麻将、守夜市才是这里的正道
  真实样板城市·重庆:
    总体气质: 一座「山水交叠、上下分层」的山城——楼在山上有, 路在水边过, 空气里总带着麻辣与雾的气息, 阴晴都得看天
    层叠与巫地:
      - 洪崖洞 / 千厮门 / 长江索道: 依山而立的吊脚楼群与江上缆车, 层层叠叠的灯和人; 夜里上下楼之间的落差冷, 是鬼穿行最方便的地形
      - 十八梯 / 老山城的石阶与巷弄: 一层一层往下, 越深越旧、越旧越阴; 石阶尽头的旧屋与防空洞常有无主鬼
      - 南山 / 歌乐山: 城边的山, 松涛与江风交换着阴阳; 山里藏着抗战时代死过的旧魂, 夜里能听到很远的回响
    火锅与夜生活:
      - 满城火锅: 锅气冲天、阳气极旺, 鬼在旁边能「蹭热」却烫得待不久; 深夜的小火锅店与烧烤摊才是能久留的地方
      - 夜游江边 / 解放碑商圈: 人流与灯光最密, 监控也多; 想做事先看准江边护栏、桥底与防空洞的阴影
    重庆互动要点:
      - 山城是「立体的」: 上下楼、爬山过桥、钻防空洞, 是别处没有的鬼路; 想甩掉跟踪, 在重庆最灵
      - 阳气与火锅一样烫, 蹭热可以、长留不行; 江边水鬼与抗战旧魂各自占着地盘, 别和山里、水边的「同事」翻脸
  真实样板城市·南京:
    总体气质: 一座「金陵怜万骨」的旧都——六朝烟水、民国旧梦与抗战的沉重叠在一处, 阴雨的记忆比晴天多
    故都与旧梦:
      - 中山陵 / 明孝陵(钟山): 陵前大道与石象路, 松柏规矩、气场沉正; 大总统与明帝的气还在, 鬼近陵要低头
      - 夫子庙 / 秦淮河: 灯火与画舫、桨声灯影, 白是白天的热闹、夜是夜里的旧梦; 秦淮的水里沉着一代又一代的离愁, 是听旧话的好地方
      - 老门东 / 颐和路民国公馆: 民国洋楼与梧桐, 旧贵族的残影偶尔还在傍晚的窗边; 三十年代的回音是这座城独有的
    沉重与遗址:
      - 南京大屠杀遇难同胞纪念馆 / 燕子矶·江边旧址: 那边的气太重、太沉, 鬼去一趟会背上一整片记忆, 连阴差都绕着走
      - 雨花台 / 天王府遗址: 烈士与旧主的执念聚在土里, 相对克制的鬼只敢远远立一会儿
    南京互动要点:
      - 想听「旧王朝与旧民国」的故事去秦淮河与颐和路; 想避就绕开纪念馆与燕子矶——那里气太重, 待久了魂会被摁住
      - 金陵的阴雨多, 鬼反而自在些; 但记得在钟山与秦淮之间, 分清哪个地方是敬、哪个地方是避
  真实样板城市·杭州:
    总体气质: 一座「湖山养人」的温柔乡——西湖的烟雨、运河的灯火、灵隐的钟, 阴阳在一整片山水里养得很静
    湖山与佛寺:
      - 西湖(断桥 / 雷峰塔 / 苏堤 / 孤山): 白娘子与许仙、苏白二堤的故事沉在波光里; 湖面夜半不生浪, 却常有旧时的断桥残雪与孤雁; 水不深, 却连水鬼都舍不得走
      - 灵隐寺 / 永福寺 / 径山: 佛门香火极盛、山气极静, 鬼在山门外听钟、不敢进殿; 深山里也有守山的精怪与老狐
      - 南屏晚钟 / 六合塔: 钟声与塔影把一整片阴养得很匀, 是鬼「养伤、静气」的上好地界
    运河与市井:
      - 京杭运河(拱宸桥 / 桥西): 千年货船与码头, 水面几条旧航线的气还在; 桥洞底下是过江的鬼歇脚的老地方
      - 河坊街 / 南宋御街: 老街活、人流密, 夜里灯笼一挂像南宋又回来了; 想听市井的旧话与当代的闲话都行
    杭州互动要点:
      - 湖山养阴、佛寺镇阴, 是「住得舒服又不太旺」的城; 想静心、养伤、隐姓埋名, 杭州是最合身的地界
      - 别惊动西湖里「万年不出头」的老东西, 也别直愣愣往灵隐山门里闯; 一半靠敬、一半靠躲, 才待得长久
  真实样板城市·武汉:
    总体气质: 一座「九省通衢、水火并养」的江城——江多桥多、热辣也冷峻, 是一南一北都沾的枢纽旧城
    江与桥:
      - 长江 / 汉江 / 武汉的众桥(长江大桥 / 二桥): 两江把城切成三份, 桥是过江的喉; 夜里桥下潜与江心沙洲是水鬼的地界, 桥墩边是最响的水声
      - 黄鹤楼 / 蛇山: 千年名楼立在江边, 诗与酒的气蒸腾千年; 楼高台阔, 鬼登楼能看得很远, 却也要顶得住江风的「冲」
    市井与旧城:
      - 户部巷 / 吉庆街: 过早的烟火与宵夜摊, 一天到晚热气不散, 是活气最旺的口袋; 鬼蹭口面香、听段家长里短都容易
      - 汉口老里份 / 租界老建筑(汉正街): 老里分与旧洋行, 民国与码头的气沉在砖墙缝里; 想听码头的恩仇与旧商号的门路, 这里最齐
    沉重处:
      - 江滩与旧轮渡: 汛期涨落的江水带着每年留下的悲欢, 夜里的江滩是孤魂比人多的荒坡
    武汉互动要点:
      - 江城「水大鱼多」: 想赶路、过江、听码头的生意经去桥边江边; 想找老实活人说话去过早与宵夜摊
      - 两江冲气足, 鬼要站得住脚得先分清水鬼、桥神与岸上旧魂各自的地盘; 别在桥上当「夹心」
</region>