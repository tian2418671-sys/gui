@@if getvar('stat_data.世界.当前幕', { defaults: '' }).includes('沙盒模式') || getvar('stat_data.世界.当前幕', { defaults: '' }).includes('第七幕')
---
<region region="其他城市游历">
其他城市游历:
  说明: 复仇了结后，<user>以厉鬼之身在人间继续存在，可自由游历其他城市；每座城自带一套灵异生态
  城市差异:
    海城:
      - 水鬼、海夜叉的地界，港口的灯火就是另一座鬼市
      - 潮汐定作息：涨潮阳气沉、退潮鬼气盛
    山城:
      - 出马仙与山魈盘桓，香火点在上山的茶寮与老宅
      - 山路与桥洞是鬼与「保家仙」谈判的地方
    古都:
      - 历史厚重，庙宇香火最旺，规矩也最重，乱闯会被香火灼
      - 遗址、旧城墙、地下防空洞里藏着旧城的阴德与残魂
    边镇:
      - 人烟稀，阴阳挨得最近，本地鬼王、道士、魔修各占一隅
      - 陌生人一眼就能被认出来，外来鬼尤其扎眼
  到每座城可做:
    - 接触本地鬼王、道士、出马仙、精怪，用人间或鬼界消息换合作
    - 在新城里慢慢拼回零星记忆碎片（想不起的妻子脸、住址、名字）
    - 帮一方或害一方，谁有用就用谁，谁挡路就除掉谁
    - 混进本地香火点、夜市、庙会，听新闻与活人的闲话
  新地盘清单:
    - 到新城的头一夜先摸规矩与地盘，别当横插一杠的傻鬼
    - 分清本地谁是「地头」，谁是「过江」，跟错队会被两方一起清
    - 记住：每个走在夜里的活人，都可能是某个道士或出马仙的线人
  沙盒法则: 无固定结局，以玩家意愿推进或结束
  真实样板城市·天津:
    总体气质: 北京像守旧的老学究, 天津更像见过世面的老绅士——海河穿城, 古今交融, 中西合璧, 是一座「九河下梢」的水城
    九河下梢:
      - 海河汇众多支流入海, 白昼喧闹, 入夜后整座城的水气都往一处沉, 是鬼最自在的地界
      - 民谚「九河下梢天津卫, 三道浮桥两道关」: 旧日的盐关浮桥、钞关浮桥早已不在, 如今只剩桥墩与老地名; 夜里仍是水鬼观潮、生魂徘徊低语的地方
    皇家与祠庙:
      - 天后宫(娘娘宫): 中国现存最古的妈祖庙之一, 护漕水神香火极盛; <user>想沾香火只能在庙外, 别进正殿
      - 玉皇阁 / 文庙: 道教与孔庙之地, 神位压身, 鬼绕道而行
    楼宇与洋风:
      - 五大道: 四百余栋风貌建筑, 夜里像一座空下来的万国博物馆; 洋楼里偶有老租界的执念客
      - 意大利风情区: 百年欧式建筑群, 夜灯昏暖, 是喝咖啡的活人与生魂都爱待的夹缝地
      - 瓷房子 / 劝业场: 瓷片贴面的洋楼与老商场, 人流散后, 墙里黏着多少年间路过客留下的心事
      - 天津之眼 / 天塔: 建在桥上的摩天轮与「水中之塔」, 高处开阔, 是绕开地面阳气的空中栈道
    故居与记忆:
      - 李叔同 / 曹禺 / 梁启超 / 张爱玲 / 张学良故居: 名流过客留下一层时代的气, 夜里想家的孤鬼会在这些街上多走两圈
      - 利顺德博物馆 / 天津老城博物馆 / 广东会馆: 近代百年的照片与物件汇在一处, 想找回一点「活着」的实感, 可去听旧物里的声音
    中西教堂与宗教:
      - 西开教堂 / 望海楼 / 大悲禅院 / 清真大寺: 神佛各守一隅; 香火凡人都进得, 鬼只能在门槛外低头避开
    天津互动要点:
      - 到天津先认「水」和「码头」: 海河两岸与老城厢是鬼的交通线, 谁占住哪一段河, 谁就有一份地盘
      - 洋楼与名人故居夜里人气淡、执念多, 是找话头、听旧事的好地方; 但别惊动老租界的执念客
      - 香火最盛的庙(天后宫)反而要绕——越虔诚的地界对鬼越不客气
</region>