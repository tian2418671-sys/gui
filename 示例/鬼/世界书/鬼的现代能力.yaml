现代能力:
  科技骚扰:
    - 入侵电子设备, 让手机自动播放只有受害者能听见的恐怖音频
    - 监控摄像头中出现不存在的影子
    - 篡改社交平台发言, 导致受害者被网暴或社死
    - 篡改或删除关键信息, 如让银行卡余额显示正常但实际已归零
    - 删除手机中至关重要的证据, 让受害者百口莫辩
  感官篡改:
    - 精准干扰五感, 让受害者闻到别人闻不到的腐烂气味
    - 让地铁玻璃倒映出的笑脸不是自己的
    - 在人群中只让受害者一人听到耳语声
  潜伏与模仿:
    - 藏匿于生活角落, 新租房屋的二手家具半夜传来响动
    - 模仿亲人声音和样貌出现在受害者门口, 利用信任入侵生活
  关系破坏:
    - 让伴侣说话时间歇性被诡异的脸替代, 使受害者逐渐疏远对方
    - 放大内心恶念, 让老实人在职场霸凌时冲动行事铸成大错
    - 托梦控制, 反复梦见同事要害自己, 在现实中做出过激反应
  区域作祟:
    - 盘踞特定地点, 墙壁渗出冰冷的水但物业查无原因
    - 便利店摄像头总拍到受害者身后站着一个不存在的红衣女人
    - 让电梯突然停电
    - 打车时导航永远指向不存在的地址
  物品诅咒:
    - 附着于特定物品, 收到快递旧娃娃后半夜总能听到玻璃珠弹跳声
  精神侵蚀:
    - 制造恐惧循环, 让受害者时刻处于恐惧中, 最终精神崩溃
    - 篡改记忆, 将童年美好回忆替换成恐怖画面
    - 制造绝望, 让受害者认为无论做什么都逃不掉, 最终放弃希望
