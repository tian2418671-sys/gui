<region region="古墓与陵园">
古墓与陵园:
  说明: <user>活动范围内与「死人长眠之地」相关的场所；对鬼而言，这是既亲近又危险的地界——阳气淡、同类的执念最浓，却也最容易惊动不该惊动的东西
  分类与互动:
    古墓:
      - 深山野岭里被盗洞钻开的旧墓、地宫，甬道里躺着陪葬的陶俑与锈铜
      - 鬼可做: 借墓室歇息、听陪葬物里残留的哀哭、寻古籍/阴器、顺走陪葬符箓抵护身
      - 会遇见: 守墓的旧魂、贪私愤的陪葬亡魂、上门摸金的盗墓贼（活人却又惊又怕，能搭话、能吓跑、能讹消息）
      - 风险: 机关与封土年深自生禁忌，乱碰陪葬物会被困在墓中；开棺引来的不止是烟，还有守陵的阴差
    皇陵:
      - 帝王陵寝与地下宫殿，护陵的阴兵/石兽常年不散，龙气与阴气混在一处，香气最冲
      - 鬼可做: 在陵园地宫外蹭君王的残念、听御用工匠与宫人的旧冤、借「皇气」压一压身上的伤势
      - 会遇见: 守陵阴兵(只认旗帜不认鬼，硬闯会被当场镇压)、陵官的执念、偷偷祭拜的活人
      - 风险: 皇陵规矩最重，冒犯龙气轻则重伤、重则被阴兵缉拿拷问；夜里别踩正殿台阶
    墓地(公墓与祖坟):
      - 城郊墓园成排的碑、供台的香与花，扫墓的人一散，整片山坡就安静下来
      - 鬼可做: 蹭没主的供品与香火、向「不会说话的邻居」打探最近逝者的消息、在墓碑间练收拢形迹
      - 会遇见: 迟迟不肯出殡的新魂、看守墓园的活人、夜里来祭奠哭坟的家属（生魂的哭声阳气最软）
      - 风险: 祖坟多有阵法或香火护持（参见「神宗家族」的祖坟禁制），别人家的坟地别乱踩
    乱葬岗:
      - 无主荒坟、野葬地、老刑场，阴气淤积最重的烂泥地，孤魂野鬼扎堆
      - 鬼可做: 最便宜的「情报集散地」——野鬼话多、胆子小、什么都能用一炷香换来；躲追杀时低头钻进去最不易被察觉
      - 会遇见: 失智疯鬼、怨气爆开的恶鬼尸(极危险)、专门来此地「捡漏」的魔修与邪修
      - 风险: 阴气太稠会侵蚀记忆与神智，待久了连自己叫什么都想不起来；被更凶的厉鬼盯上就只剩「被吞」的下场
  通用提示:
    - 越是「长眠之地」，活人越少、鬼越自在，但也越容易碰到同类里最疯最狠的那一档
    - 郊外/荒地/新坟/野葬: 阳气极淡, 是鬼疗伤与躲藏的好去处; 但若有阵法/香火护持则另当别论
    - 在身上留一张干纸钱或供过的黄纸，进陵墓乱葬岗前先「问路」，能省去大半无谓的追杀
    - 夜里的墓地最像集市: 新鬼哭、旧鬼念、饿鬼讨香；想听人间最新的死讯与旧事，这里比鬼市更便宜，也更快
</region>