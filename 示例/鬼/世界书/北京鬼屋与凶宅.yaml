北京鬼屋与凶宅(凶宅/紫禁城幽灵/皇陵诅咒):
  说明: 城里流传的「凶宅鬼宅」与「皇陵诅咒」——凶到活人不敢住、阴到普通鬼也不敢久留; 对<user>既是能钻的空子、也是会被反咬的险处, 要的是「过路客」的分寸
  京城凶宅「四大」:
    朝内大街81号(京城第一鬼宅):
      - 建于十九世纪末二十世纪初, 传为英国人建的教堂因战停工; 流传国民党姨太太上吊、探险者录到怪声, 民间有「想拆它的人有去无回」的说法
      - 对鬼: 是老鬼扎堆的空宅, 想躲、想谈事都可钻; 但「拆不动的气」还在, 住久了神智会被这栋楼的旧事占住, 别恋栈
    劲松鬼楼(劲松二区207楼):
      - 建于1977年, 其地下60年代前曾是南城最大乱葬岗; 1984年前后传闻天黑有哭声、鬼火, 楼体颜色至今与周边不同
      - 对鬼: 楼是「盖在坟上」的楼, 阴气极足, 是疗伤与藏身的上选; 但底下乱葬岗的老魂多, 想占这里是抢地盘, 要蹲得下来
    小石虎胡同33号:
      - 曾为吴三桂之子、乾隆长孙等住所, 曹雪芹也曾在此任职; 夜深传有女子吟诗与丝竹之声, 纪晓岚亦记载过灵异
      - 对鬼: 是「文人旧鬼」的地界, 想听前朝诗、搭名士执念、求一句指点, 这里比菜市口雅、也比菜市口挑人
    湖广会馆 / 郑亲王府:
      - 湖广会馆旧为乱葬岗, 常传灵异; 郑亲王府传有冤魂; 同列「四大凶宅」
      - 对鬼: 一座是戏台看尽离别, 一座是王府积年恩怨; 想打听京城旧贵族的底细与旧案, 这两处门路最幽
  紫禁城幽灵:
    - 西六宫: 子夜冤死的宫中孤魂在此游荡; 宫墙用含四氧化三铁的建材, 雷雨天会像「录像」一样映出宫女行走的影迹
    - 镇宫之兽: 传说是一种像鼠又像猪的怪兽, 皇族所养常年守宫; 鬼要翻宫墙, 最怕撞见的不是阴差, 是它
  皇陵诅咒(帝陵的「气」):
    - 明定陵: 唯一被考古发掘的明代帝陵, 开棺后多人死亡, 棺木被村民拾去做家具也牵连悲剧 → 被传「被诅咒的定陵」
    - 清裕陵「鬼堵门」: 1928年孙殿英盗掘, 乾隆棺椁莫名移动顶住最后一道石门, 怎么都打不开
    - 万寿山佛香阁: 乾隆挖到明妃古墓、见「你不动我, 我不动你」, 回填镇压(与「北京名俗」相通, 此处不赘)
    - 对鬼: 帝陵是老鬼论资排辈的最高处、也最凶; 想借皇陵的气是拿命赌, 见石像封土远远拜上一拜最稳
  整座城的「阴点」/聚集地:
    - 凤凰岭(「阴阳界」): 阴气重, 活人登山入夜易迷, 鬼在这也最混得开
    - 石佛寺山洞(延庆, 洞口刻「幽冥界」): 被称为「北京鬼洞」, 名比寻常凶宅更硬
    - 「诡八楼」: 楼内异常阴冷、与外界温差极大, 是鬼气胸塞的一栋楼
    - 北新桥海眼(锁龙): 锁龙钉, 阴气极沉带忌讳, 另一处「北京名俗」已详说
  鬼视角小贴士:
    - 凶宅与皇陵都是「气沉地险」: 能借势、能藏身, 但住久了认主、贪了反咬——要时刻当「过路客」
    - 想找同类聚会去乱葬岗、劲松; 想攀京城旧贵去小石虎胡同、湖广; 想掂量自己有几分斤两才去碰皇陵
    - 别把「传说」当「理」: 越传得神乎其神的凶宅, 越藏着一句没说透的人命旧账——是人死得冤, 不是鬼有多神
