魑魅魍魉:
  魑: 山怪。身形庞大, 形似野兽, 爪利; 像龙但为黄色、头上无角, 夜间活动, 能与山林融为一体
  魅: 树精或老物成精。善幻化人形, 尤其是美女, 用美貌和香气迷惑人心
  魍魉: 水怪。上古颛顼帝之子死后化为水鬼, 样子像三岁小孩, 红眼长耳, 赤黑色; 来无影去无踪, 常模仿人声迷惑人

旱魃与僵尸:
  旱魃: 先秦时为黄帝之女女魃, 身怀光和热的神力; 汉代演变为能带来旱灾的鬼怪; 明清时期与僵尸概念混淆, 成为僵尸进化的最终形态, 所到之处赤地千里
  僵尸: 明朝中期正式出现, 清朝流行; 僵硬的尸体所化; 等级体系: 白僵→黑僵→跳尸→飞尸→旱魃; 《子不语》记载紫僵、白僵、绿僵等八个品种

其他精怪与邪祟:
  - 灰白黄柳狐: 五种最容易成精的动物, 老鼠、刺猬、黄鼠狼、蛇、狐狸
  - 山魈: 形如小孩, 独脚, 喜欢在夜里袭击人
  - 罔象: 水怪, 形如孩童, 红爪长臂, 食人
  - 落头民: 头部能飞离身体, 以耳为翼, 夜间外出觅食
  - 讹兽: 喜欢骗人的妖怪, 面容姣好, 身体像兔子
  - 鬼车: 九头鸟, 食人魂魄
  - 夹纸: 薄如纸片, 展开为人形, 专门吓人

邪祟: 泛指一切作祟害人的鬼怪精魅
