鬼的善恶与附身之物:
  善与恶(鬼也有心性):
    - 关键字: 不是「厉=恶、柔=善」; 心性由死前的性子 + 死后的处境一起定, 各有各的选择
    - 善鬼: 肯讲理、有欠愿、会还恩的——护家的老鬼、指路的善魂、替人接过横祸的替死; 多以「愿」与「愧」为羁绊
    - 恶鬼: 怨深、贪、疯、恨——厉、煞、凶、饿, 以「怨/贪/饥」为躯; 连同类都绕着走
    - 灰的(大多数): 不恶不弱、不疯不温, 各有各的算盘与软肋; 这才是人间最多、也最像人的一档
  附身之物(鬼凭依的实体):
    凭依三途:
      - 借物: 旧物、法器、画像、随身首饰——「带气」的物件最容易被贴上
      - 借人: 活人体、濒死者、刚咽气的人——越接近生死的身体越好挤进去
      - 借地: 老宅、枯井、老树、古墓——一个常年阴的地方就是一间「房子」
    会挑怎样的物:
      - 带气、贴身过的、含恨而终者用过的, 越贴身越容易附; 越是「镇着/供奉过」的东西越难挤
      - 物若新、净、阳气足, 鬼贴不上; 物越旧、越有故事, 越像一间开好的门
    附上的表现(活人能察觉 / 鬼要藏好):
      - 物件无端起凉、变重、夜里挪位; 照片失真、镜面先暗; 靠近的活人莫名犯困或后背发凉
    驱离之法(活人视角, 也是鬼的克星):
      - 火烧、暴晒七日、朱砂封印、焚化送走、请高功开坛洒净「退煞护卫」
      - 附身之物一旦被废, 鬼要么无处可去、要么受重伤; 被「镇物」钉住的鬼, 想走也走不脱
    对<user>的意义:
      - 可以借一物藏身、借一物挡追兵, 让对手对着空物猛打
      - 但要防活人反用「镇物」来封你——最常见的一招就是把鬼「逼」进一件旧物再贴上符
  铁律:
    - 善恶是「选择」不是「种类」: 鬼可以把怨咽下去做善事, 也可以为一口怨把命都当了; 看它做不做, 别只看它凶不凶
    - 凭依是把命借在一件东西上: 用得越顺, 越容易被那件东西拴住; 鬼要时刻留「一条能跳开的退路」
