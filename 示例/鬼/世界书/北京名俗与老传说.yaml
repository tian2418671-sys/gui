北京名俗与老传说:
  说明: 北京的「老话与旧鬼」合集——名鬼、九门、刑场、水系与地脉; 散落在主舞台之外的传说, 遇事按需浮现, 可借势、可避让
  古代鬼魂与墓主传说(名鬼与遗迹钩子):
    颐和园佛香阁 / 万寿山古墓:
      - 传说乾隆修清漪园时挖出明朝王妃古墓, 墓门刻「你不动我, 我不动你」, 便回填、起佛香阁镇之; 万寿山下埋着动不得的王妃
      - 对鬼: 那王妃未必真没了——真到夜半, 万寿山后山会传来极宁的、像商量又像叩门的动静; 识相的不会去撩拨, 也有传言谁讨好她、她护谁一族平安
    故宫魅影 / 珍妃井:
      - 东筒子夹道夜深可见清装宫女太监列队无声走过; 宫墙内阴阳极重, 历代宫怨、执念堆积, 普通鬼进去容易「被同化」, 迷失自己是哪个朝代的
      - 珍妃井: 冤魂不散的旧事, 井边戾而不恶, 近处阴气沉到连恶鬼都要绕三分
    北新桥锁龙井:
      - 传说井里锁着一条龙, 垂着粗大铁链; 有人扯链便黑水翻涌、巨响不绝
      - 对鬼: 那口井是整座城一块「镇龙钉」, 阴气极沉却带着「忌讳」——水边、井下都有古怪, 寻常鬼靠近会浑身发冷、像被什么东西盯上; 别碰、别听、别靠太近
    房山长沟大墓:
      - 当地相传墓主是「鞑摩王」, 棺椁下压着通往涿州的「海眼」, 触之引发水灾
      - 对鬼: 那是比<user>更深、更老的凶地, 阴气像压着一整个冬天; 若赶路途经, 远远拜一拜、绕开走最稳妥, 也有鬼传说里面躺着的东西半夜会「翻一个身」, 那声音隔着几十里都听得见
    名鬼传说的用处:
      - 遇到解决不了的对手(阴差难缠、魔修追击、家族屏障), 有胆识者可顺藤去借势、求一句指点、或拿它们当由头对人编话
      - 但记住: 传说里越「镇住」的东西越凶, 求它护你是赌命, 谁也不知道它在午夜里还认不认香火
  内城九门与老城墙(九门旧话):
    - 北京内城旧有九门, 每门在过去各管一事, 夜里门门有讲不完的旧话:
      - 正阳门: 皇帝走的门, 气最正; 夜里沉静, 鬼不敢正走
      - 崇文门: 管税收的门, 老话说它夜里最「斤斤计较」, 有衙门鬼在门前对账
      - 宣武门: 出囚车、走刑人的「死门」, 怨气最重, 冤魂在门下盼着公道
      - 朝阳门: 走粮车, 门上有旧粮食的米味, 饿鬼爱在这蹭一点饱气
      - 阜成门 / 西直门: 走煤与进水的门, 一个身上常带黑灰, 一个总跟水打交道
      - 安定门 / 德胜门: 出兵的战门, 夜里的风都带铁锣味; 坊间说这两门膛气最硬, 鬼近前三步先矮三分
      - 东直门: 走木料的门, 门下堆着几百年没散的木香与刨花梦
    - 城墙瓮城: 夜里进了瓮城像被扣进一口钟, 回音把人/鬼自己一遍遍放给耳朵听; 不认得路, 会被困在里头转天亮
    - 九门的用处: 想要什么「气」, 就去哪座门下歇——要打架找战门、要讨公道找死门、要吃饱找粮门; 别走错, 走了错门等于挨了一记闷棍
  刑场与冤魂(菜市口 / 午门):
    - 菜市口曾是清代处决人的地方, 积年的怨气沉在石板下, 夜里常有人影对着空街 「喊冤」
    - 午门城外是廷杖与斩首之地, 老话叫「推出午门斩首」; 那里的执念戾而不散, 寻常鬼靠近会被怨气拽着走
    - 对<user>: 想找「同样死得冤、咽不下这口气」的老鬼结盟、求指点, 这就是现成的「同类」最多的地方; 想顺藤摸瓜查清一桩旧年冤案, 也有讲不完的故事等着
    - 风险: 怨气最重之地最容易引来灵异组与高功注目, 待久了神智与记忆松得快, 别把这里当久留的客栈
  水系与桥(水边的人间与鬼界):
    - 筒子河 / 护城河: 围着宫城的老水, 夜里有宫人旧怨在水下慢慢流; 水冷、阴、沉, 鬼可以在河面飘着听岸上闲话
    - 什刹海 / 后海 / 玉河: 商街与水岸并行的活地, 夜里是城里最有人气的夜场, 也是消息最杂、最容易「顺耳」的地方
    - 昆玉河 / 永定河(北京五大水系): 城外的水野, 河陂与芦苇荡里住着水鬼、水妖与老潭的守物; <user>死在路不是死在水, 但要在外边办事, 水边是多一条退路的
    - 卢沟桥: 老话「卢沟桥的狮子数不清」, 每只石狮半夜会数一遍自己, 多一只就多一桩没处诉的旧事; 桥洞下的水与月色是鬼歇脚的好去处
    - 桥的规矩: 谁都别在又冷又黑的桥上与「对面来的」搭话——它很可能是水鬼上身讨替, 三句就能把魂勾走
  地脉与名迹旧话:
    - 先有潭柘后有北京: 潭柘寺比京城更老, 老到寺里的香火自成一套老规矩; 求事去那, 比京城里任何庙都灵, 也最难伺候
    - 白云观「摸石猴」: 正月里人人去摸那只石猴消灾; 夜里那石猴是「活的」, 会睁眼认人, 摸对了它护你, 摸错它记你
    - 天坛回音壁: 白天是声学的奇观, 夜里是鬼话的通道——把话对着壁面说, 半座城的鬼都听得见, 是「喊话、传信、下战书」都不留证据的老法子
    - 燕京八景与旧八景: 西山晴雪、卢沟晓月等, 名的景早被现代楼体盖住一半, 但「旧景的地脉」没散, 想避煞、聚气、许愿, 老景的穴位永远比新楼灵
