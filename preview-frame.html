<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>状态栏预览帧</title>
<script src="https://testingcf.jsdelivr.net/npm/vue@3/dist/vue.global.prod.js"></script>
<script src="https://testingcf.jsdelivr.net/npm/jquery@3/dist/jquery.min.js"></script>
<script src="https://testingcf.jsdelivr.net/npm/lodash@4/lodash.min.js"></script>
<style>
  html, body { margin: 0; padding: 8px; background: #0a0e10; }
  #app { max-width: 720px; }
</style>
</head>
<body>
<div id="app"></div>

<script>
  // ── mock 酒馆助手环境：变量统一从父窗口的 __STAT_DATA__ 读取/写入 ──
  window.getCurrentMessageId = function () { return 1; };
  window.waitGlobalInitialized = function () { return Promise.resolve(); };
  window.errorCatched = function (fn) { return fn; };
  window.updateVariablesWith = function (fn, opt) {
    const v = window.getVariables(opt);
    fn(v);
    // ⚠️ 编辑器模式：绝不把解析结果整体写回 parent.__STAT_DATA__。
    // 原因：preview 的 store 轮询（mvu.ts）每次 safeParse 都会产生"新引用"对象，
    // 只要检测到任何值变化就会 updateVariablesWith，若整体替换父对象，
    // 编辑器表单绑定在旧对象上就会与数据源脱钩 → 表单编辑全部失效（历史根因）。
    // 编辑器数据流是单向的「表单 → __STAT_DATA__ → 预览轮询读取」，预览侧无需写回。
    // 若未来状态栏 UI 需要写数据，请改为按字段合并（_.merge）而非整体替换。
    return v;
  };
  window.getVariables = function () {
    const p = window.parent;
    const stat = (p && p.__STAT_DATA__) || {};
    // 深拷贝模拟 MVU「整体替换」语义：真实酒馆里 MagVarUpdate 每次更新
    // stat_data 都会替换为新对象（引用变化），store 的引用缓存据此判断"数据已变化"；
    // 若不拷贝（同引用），表单原地修改将无法被轮询感知。
    return { stat_data: JSON.parse(JSON.stringify(stat)) };
  };
</script>

<script type="module">
  // 注入全局 z（Zod v4，schema.ts 依赖）与 webpack cjs 运行时
  import * as zod from 'https://testingcf.jsdelivr.net/npm/zod@4/+esm';
  window.z = zod;
  window.__webpack_require__ = {
    cjs: (e) => { const t = { exports: {} }; e(t.exports, t.exports, t.exports); return t.exports; }
  };

  const resp = await fetch('dist/Gui/界面/状态栏/index.html');
  const html = await resp.text();
  const doc = new DOMParser().parseFromString(html, 'text/html');
  // 提取并注入 <style>（global.css + scoped 样式）
  doc.querySelectorAll('style').forEach((el) => {
    const s = document.createElement('style');
    s.textContent = el.textContent;
    document.head.appendChild(s);
  });
  // 提取并执行 <script type="module">
  const moduleScript = doc.querySelector('script[type="module"]');
  if (moduleScript) {
    const s = document.createElement('script');
    s.type = 'module';
    s.textContent = moduleScript.textContent;
    document.body.appendChild(s);
  }
</script>
</body>
</html>
